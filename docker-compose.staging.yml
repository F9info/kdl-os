# CI/E2E-only overlay — apply on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up
# The direct service ports below exist solely so the E2E runner can bypass
# nginx; they are loopback-bound and this overlay must never be used for a
# real deployment (use docker-compose.prod.yml instead) — KDL-270 L14.
services:
  backend:
    image: ghcr.io/kalamdreamlabs/kdl-starter-kit/backend:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: staging
    ports:
      - "127.0.0.1:4000:4000" # E2E runner only — loopback, never public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: ghcr.io/kalamdreamlabs/kdl-starter-kit/frontend:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: http://localhost:80/api # Use Nginx for API proxy
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - "127.0.0.1:3000:3000" # E2E runner only — loopback, never public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  ai-services:
    image: ghcr.io/kalamdreamlabs/kdl-starter-kit/ai-services:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: staging
    ports:
      - "127.0.0.1:5000:5000" # E2E runner only — loopback, never public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    ports:
      - "127.0.0.1:80:80"
