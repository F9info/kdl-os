services:
  backend:
    image: ghcr.io/kalamdreamlabs/kdl-starter-kit/backend:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: staging
    ports:
      - "4000:4000" # Expose for E2E testing
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: ghcr.io/kalamdreamlabs/kdl-starter-kit/frontend:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: http://localhost:80/api # Use Nginx for API proxy
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - "3000:3000" # Expose for E2E testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  ai-services:
    image: ghcr.io/kalamdreamlabs/kdl-starter-kit/ai-services:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: staging
    ports:
      - "5000:5000" # Expose for E2E testing
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    ports:
      - "80:80"