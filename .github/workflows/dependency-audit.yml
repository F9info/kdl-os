name: Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-backend:
    name: Audit backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Report all advisories
        working-directory: backend
        run: npm audit --audit-level=info || true

      - name: Fail on High/Critical
        working-directory: backend
        run: npm audit --audit-level=high

  audit-frontend:
    name: Audit frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Report all advisories
        working-directory: frontend
        run: pnpm audit --audit-level=info || true

      - name: Fail on High/Critical
        working-directory: frontend
        run: |
          set -euo pipefail

          # Waivered GHSA IDs — dev-only transitive advisories with no upstream patched
          # version (first_patched_version = null). Registry + justifications:
          # docs/DEPENDENCY_TRIAGE.md → "Active security waivers" (KDL-460).
          # GHSA-w3rx-r6r6-pgpr — image-size ICNS DoS, dev-only via @storybook/nextjs (review by 2026-11-17)
          # GHSA-5p2g-fcmc-qvqq — image-size JXL/HEIF DoS, dev-only via @storybook/nextjs (review by 2026-11-17)
          # GHSA-848j-6mx2-7j84 — elliptic risky crypto primitive (LOW; listed for the registry,
          #   does not gate) — dev-only via node-polyfill-webpack-plugin (review by 2026-11-17)

          AUDIT_FILE=$(mktemp)
          SCRIPT_FILE=$(mktemp --suffix=.js)

          pnpm audit --json > "$AUDIT_FILE" || true

          cat > "$SCRIPT_FILE" << 'EOF'
          const fs = require('fs');
          const waivers = new Set(['GHSA-w3rx-r6r6-pgpr', 'GHSA-5p2g-fcmc-qvqq', 'GHSA-848j-6mx2-7j84']);
          const data = JSON.parse(fs.readFileSync(process.env.AUDIT_FILE, 'utf8'));
          const advisories = data.advisories || {};
          const failing = [];
          for (const [key, adv] of Object.entries(advisories)) {
            const sev = (adv.severity || '').toLowerCase();
            if (sev !== 'high' && sev !== 'critical') continue;
            const ghsas = (adv.identifiers && adv.identifiers.GHSA) || adv.ghsas || [key];
            if (!ghsas.some(g => waivers.has(g))) {
              failing.push(key + ': ' + (adv.title || '') + ' [' + adv.severity + ']');
            }
          }
          if (failing.length) {
            process.stderr.write('Non-waivered HIGH/CRITICAL advisories:\n' + failing.map(f => '  ' + f).join('\n') + '\n');
            process.exit(1);
          }
          console.log('All HIGH/CRITICAL advisories are waivered. Audit passed.');
          EOF

          AUDIT_FILE="$AUDIT_FILE" node "$SCRIPT_FILE"

  audit-ai-services:
    name: Audit ai-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-services/package-lock.json

      - name: Install dependencies
        working-directory: ai-services
        run: npm ci

      - name: Report all advisories
        working-directory: ai-services
        run: npm audit --audit-level=info || true

      - name: Fail on High/Critical
        working-directory: ai-services
        run: npm audit --audit-level=high
