name: Secret Scan

# Fails a pull request that adds a credential, key, .env file or database dump.
# Same script as the pre-commit hook (scripts/secret-scan.mjs). No third-party action, nothing to download.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan the files this change touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            node scripts/secret-scan.mjs --range "$BASE...HEAD"
          else
            node scripts/secret-scan.mjs --all
          fi
