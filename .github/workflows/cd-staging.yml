name: CD Staging

# Deploys latest master images to the always-on staging VPS.
# Required GitHub secrets — set in repo Settings → Environments → staging → Secrets
# (NOT in repo-level Secrets → Actions; the preflight job reads them via environment scope):
#   STAGING_HOST       — IP or hostname of the staging VPS
#   STAGING_USER       — SSH user (e.g. ubuntu, root)  [already set]
#   STAGING_SSH_KEY    — private key whose public half is in authorized_keys on VPS  [already set]
#   STAGING_ENV        — full staging .env contents; generate with:
#                        bash infra/gen-staging-env.sh > /tmp/staging.env
#                        gh secret set STAGING_ENV --env staging < /tmp/staging.env
#   GHCR_TOKEN         — (optional) PAT with read:packages; falls back to built-in
#                        GITHUB_TOKEN when not set (same-org packages only)
#
# Required variable — set in repo Settings → Environments → staging → Variables:
#   STAGING_URL        — public URL of the staging site (used for the deployment link)
#
# One-time VPS bootstrap (run once by a human — see MANUAL_TASKS.md):
#   ssh $STAGING_USER@$STAGING_HOST 'bash -s' < infra/scripts/staging-bootstrap.sh

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  preflight:
    name: Check staging secrets
    runs-on: ubuntu-latest
    environment:
      name: staging
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check if staging secrets are provisioned
        id: check
        env:
          _STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [[ -n "$_STAGING_HOST" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "## Staging deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Staging secrets (\`STAGING_HOST\` / \`STAGING_SSH_KEY\`) are not yet provisioned." >> "$GITHUB_STEP_SUMMARY"
            echo "See **MANUAL_TASKS.md → staging runbook** or the parent task KDL-373 for provisioning steps." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-staging:
    name: Deploy to staging
    needs: [preflight]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # allows GITHUB_TOKEN to pull from ghcr.io/f9info/*
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}   # Set STAGING_URL in repo → Environments → staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.preview.yml,infra/nginx/nginx.conf"
          target: "/opt/kdl-staging"
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          STAGING_ENV_CONTENTS: ${{ secrets.STAGING_ENV }}
          # Prefer GHCR_TOKEN PAT when set; fall back to built-in GITHUB_TOKEN
          # (GITHUB_TOKEN has read:packages for same-org ghcr.io images)
          GHCR_TOKEN_PAT: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN_FOR_GHCR: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_TAG,STAGING_ENV_CONTENTS,GHCR_TOKEN_PAT,GITHUB_TOKEN_FOR_GHCR,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd /opt/kdl-staging

            # Write the staging .env from the secret (overwrite each deploy)
            printf '%s' "$STAGING_ENV_CONTENTS" > .env

            # Authenticate with GHCR — prefer explicit PAT (GHCR_TOKEN), fall back to
            # built-in GITHUB_TOKEN which has read:packages for same-org images.
            _ghcr_token="${GHCR_TOKEN_PAT:-$GITHUB_TOKEN_FOR_GHCR}"
            echo "$_ghcr_token" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Pull new images before taking the stack down (zero-downtime window)
            IMAGE_TAG="$IMAGE_TAG" \
              docker compose -f docker-compose.yml -f docker-compose.preview.yml pull

            # Bring the full stack up (recreate changed containers only)
            IMAGE_TAG="$IMAGE_TAG" \
              docker compose -f docker-compose.yml -f docker-compose.preview.yml \
              up -d --remove-orphans

            # Run pending DB migrations (idempotent)
            docker compose exec -T backend npx prisma migrate deploy || true

            # Quick health check — nginx must return HTTP 200
            sleep 10
            curl -sf http://localhost/health || \
              (echo "Health check failed"; docker compose logs --tail=50; exit 1)

            echo "Staging deploy complete — IMAGE_TAG=$IMAGE_TAG"

      - name: Post staging URL to job summary
        run: |
          echo "## Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${{ vars.STAGING_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag:** \`${{ env.IMAGE_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
