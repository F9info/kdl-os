name: CI

# Cheap per-package gate — runs on every PR that touches code.
# Heavy jobs (storybook, a11y-smoke, full build + e2e) live in ci-heavy.yml.
#
# Skip CI entirely by including [skip ci] in a commit message.
# Docs-only PRs (*.md, docs/**, images) produce zero jobs.
#
# Per-package scoping: only the job(s) for the changed package(s) run.
# A frontend-only change never triggers backend or ai-services jobs.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
      - '.gitignore'
      - '.gitattributes'
      - 'CODEOWNERS'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      ai-services: ${{ steps.changes.outputs.ai-services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ai-services:
              - 'ai-services/**'

  # ── Backend: syntax check + unit tests ────────────────────────────────────
  backend-check:
    name: Backend — lint + test
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: node --check src/index.js

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-characters
        run: npm test

  # ── Frontend: format + lint + typecheck + unit tests (no build, no e2e) ───
  frontend-check:
    name: Frontend — lint + typecheck
    needs: filter
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Format check
        working-directory: frontend
        run: pnpm format:check

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm type-check

      - name: Unit tests
        working-directory: frontend
        run: pnpm test

  # ── AI Services: syntax check + unit tests ────────────────────────────────
  ai-services-check:
    name: AI Services — lint + test
    needs: filter
    if: needs.filter.outputs.ai-services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-services/package-lock.json

      - name: Install dependencies
        working-directory: ai-services
        run: npm ci

      - name: Syntax check
        working-directory: ai-services
        run: node --check src/index.js

      - name: Run tests
        working-directory: ai-services
        env:
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
        run: npm test
