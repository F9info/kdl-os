name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: node --check src/index.js

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-characters
        run: npm test

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (warn — all severities)
        working-directory: frontend
        run: pnpm audit --audit-level=low || true

      - name: Audit dependencies (gate — high/critical)
        working-directory: frontend
        run: pnpm audit --audit-level=high

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Run tests
        working-directory: frontend
        run: pnpm test

  ai-services-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-services/package-lock.json

      - name: Install dependencies
        working-directory: ai-services
        run: npm ci

      - name: Syntax check
        working-directory: ai-services
        run: node --check src/index.js

      - name: Run tests
        working-directory: ai-services
        env:
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
        run: npm test
