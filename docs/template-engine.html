<!-- Theme Engine prototype (KDL-437). Filename kept as template-engine.html for URL stability; the module itself was renamed to Theme Engine. -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Settings — Template Engine | KDL Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..800;1,400&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300..800&family=Lato:wght@300;400;700&family=Montserrat:wght@300..800&family=Source+Sans+3:wght@300..800&display=swap">
<style>
  :root, [data-theme="dark"] {
    --bg: #1e1e20; --sidebar: #26262a; --surface: #2a2a2e; --surface-2: #323236;
    --hairline: #3d3d42; --border: #3d3d42;
    --text: #f2f2f5; --muted: #a5a5ad;
    --accent: #4f8ef7; --accent-soft: #4f8ef726;
    --green: #32d74b; --amber: #ffd60a; --red: #ff453a;
    --shadow: 0 18px 60px rgba(0,0,0,.55);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="light"] {
    --bg: #e9e9ec; --sidebar: #eeeef1; --surface: #f6f6f8; --surface-2: #ffffff;
    --hairline: #e0e0e4; --border: #d8d8dd;
    --text: #1d1d21; --muted: #74747c;
    --accent: #0a66f0; --accent-soft: #0a66f014;
    --green: #1f9a3d; --amber: #a87b00; --red: #d02f28;
    --shadow: 0 18px 60px rgba(40,50,80,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: stretch; justify-content: stretch; padding: 0;
  }

  /* ===== Window — full surface ===== */
  .window {
    width: 100%; height: 100%;
    background: var(--surface);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    background: var(--sidebar); flex-shrink: 0; user-select: none;
    border-bottom: 1px solid var(--hairline);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .titlebar .title { flex: 1; text-align: center; font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .titlebar .theme-btn {
    background: transparent; border: 1px solid var(--hairline); color: var(--muted);
    border-radius: 7px; padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  .titlebar .theme-btn:hover { color: var(--text); }

  /* ===== Platform bar — Web App / TV / Android / iOS ===== */
  .platformbar {
    display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;
    padding: 8px 16px; background: var(--sidebar);
    border-bottom: 1px solid var(--hairline); flex-shrink: 0; user-select: none;
  }
  .plat-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 18px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; font-weight: 600; color: var(--muted);
  }
  .plat-btn:hover { color: var(--text); background: var(--surface-2); }
  .plat-btn.on { background: var(--accent); color: #fff; }
  .plat-btn .p-dirty {
    width: 7px; height: 7px; border-radius: 50%; background: var(--amber); display: none;
  }
  .plat-btn.is-dirty .p-dirty { display: block; }
  .plat-btn.on .p-dirty { background: #fff; }

  .body { flex: 1; display: flex; min-height: 0; }

  /* ===== macOS Sidebar ===== */
  .sidebar {
    width: 252px; flex-shrink: 0; background: var(--sidebar);
    border-right: 1px solid var(--hairline);
    display: flex; flex-direction: column; padding: 12px 10px;
  }
  .sb-search {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 5px 9px; margin-bottom: 12px;
  }
  .sb-search input { border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; width: 100%; }
  .sb-search input::placeholder { color: var(--muted); }
  .sb-list { flex: 1; overflow-y: auto; scrollbar-width: thin; }
  .sb-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 9px; margin-bottom: 1px;
    border-radius: 7px; cursor: pointer; color: var(--text); font-size: 14.5px; position: relative;
  }
  .sb-item:hover { background: var(--surface-2); }
  .sb-item.active { background: var(--accent); color: #fff; }
  .sb-cap {
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 14px 9px 5px; user-select: none;
  }
  .sb-cap:first-child { margin-top: 4px; }
  .sb-item .ic {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    color: #fff; box-shadow: inset 0 -4px 8px rgba(0,0,0,.18);
  }
  .sb-item .dirty-dot {
    margin-left: auto; width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber); display: none;
  }
  .sb-item.is-dirty .dirty-dot { display: block; }
  .sb-item.active .dirty-dot { background: #fff; }

  /* ===== Main panel ===== */
  .main { flex: 1; display: flex; min-width: 0; background: var(--surface); }
  .workarea { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ===== Right preview panel + device frames ===== */
  .preview-panel {
    width: 360px; flex-shrink: 0; border-left: 1px solid var(--hairline); background: var(--sidebar);
    padding: 16px 14px 24px; overflow-y: auto; scrollbar-width: thin;
    display: flex; flex-direction: column; align-items: center;
  }
  /* Children scroll, never squash — a tall editor must not crush the device frame */
  .preview-panel > * { flex-shrink: 0; }
  #formEditor { width: 100%; }
  .pv-cap { font-size: 11px; font-weight: 700; letter-spacing: .09em; color: var(--muted); margin-bottom: 16px; align-self: flex-start; text-transform: uppercase; }
  .pv-note { font-size: 11px; color: var(--muted); margin-top: 14px; text-align: center; }
  .pv-empty { color: var(--muted); font-size: 12.5px; margin-top: 30px; }
  @media (max-width: 1080px){ .preview-panel { display: none; } }

  .dev-phone {
    width: 280px; border: 9px solid #0b0b0c; border-radius: 34px; overflow: hidden; background: #000;
    box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 0 0 2px #2c2c2e;
  }
  .dev-screen { min-height: 300px; background: var(--bg); display: flex; flex-direction: column; }
  /* Preview roots fill the screen so app shells reach the real edges */
  .dev-screen > div { flex: 1 0 auto; display: flex; flex-direction: column; }
  /* Phone frames get a real phone aspect ratio, and the theme mini-app
     stretches to fill the screen so it reads like an actual mobile app. */
  .dev-phone .dev-screen { min-height: 500px; }
  .dev-screen > div:has(.mini-app) { flex: 1; display: flex; flex-direction: column; }
  .dev-screen .mini-app { flex: 1; height: auto; min-height: 170px; }
  .dev-androidnav { display: flex; justify-content: space-around; align-items: center; background: #0b0b0c; color: #9a9aa2; padding: 8px 44px; font-size: 13px; }
  .dev-ios-top { background: #000; padding: 6px 0 3px; display: flex; justify-content: center; }
  .dev-ios-top span { width: 92px; height: 15px; border-radius: 99px; background: #0b0b0c; border: 1px solid #232325; }

  .dev-tv { width: 320px; border: 8px solid #0b0b0c; border-radius: 10px; background: #000; overflow: hidden; box-shadow: 0 16px 44px rgba(0,0,0,.5); }
  .dev-tv-screen { min-height: 180px; background: #0d0d0f; }
  .dev-tv-stand { width: 70px; height: 16px; background: #0b0b0c; margin: 0 auto; clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); }
  .dev-tv-base { width: 140px; height: 5px; background: #141416; border-radius: 3px; margin: 0 auto; }

  .dev-browser { width: 320px; border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface-2); }
  .dev-browserbar { display: flex; align-items: center; gap: 5px; background: var(--surface); padding: 8px 10px; border-bottom: 1px solid var(--hairline); }
  .dev-browserbar .d { width: 9px; height: 9px; border-radius: 50%; }
  .dev-url { flex: 1; background: var(--bg); border-radius: 6px; font-size: 10px; color: var(--muted); padding: 3px 10px; margin-left: 6px; }
  .pane-head {
    padding: 18px 26px 10px; flex-shrink: 0;
  }
  .pane-head h1 { font-size: 25px; font-weight: 700; letter-spacing: -.3px; }
  .pane-head p { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .content { flex: 1; overflow-y: auto; padding: 4px 32px 30px; scrollbar-width: thin; }

  /* Grouped section — macOS "inset grouped list" */
  .group-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 20px 4px 7px; cursor: pointer; user-select: none;
  }
  .group-label .chev { font-size: 9px; transition: transform .16s; }
  .section.open .group-label .chev { transform: rotate(90deg); }
  .group-body {
    background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 10px;
    overflow: hidden; display: none;
  }
  .section.open .group-body { display: block; }

  .row {
    display: grid; grid-template-columns: minmax(220px, 380px) 1fr; gap: 14px; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid var(--hairline);
  }
  .row:last-child { border-bottom: 0; }
  .row .lbl b { display: block; font-size: 14.5px; font-weight: 500; }
  .row .lbl span { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .row .ctl { display: flex; align-items: center; gap: 9px; justify-content: flex-end; flex-wrap: wrap; }
  .row.hidden { display: none; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } .row .ctl { justify-content: flex-start; } }

  /* ===== Controls ===== */
  input[type=text], input[type=password], input[type=email], select, textarea {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 7px 10px; font-size: 14px; outline: 0; min-width: 220px;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { width: 100%; min-height: 84px; font-family: var(--mono); font-size: 13px; resize: vertical; }
  input[type=number] {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 7px 10px; font-size: 14px; width: 96px; outline: 0;
  }
  .unit { color: var(--muted); font-size: 13px; }
  .unit-sel { min-width: 62px !important; width: 62px; padding: 6px 4px; }

  .colorctl { display: flex; align-items: center; gap: 8px; }
  .colorctl input[type=color] {
    width: 32px; height: 24px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; cursor: pointer; padding: 1px;
  }
  .colorctl .hex { font-family: var(--mono); font-size: 13px; color: var(--muted); width: 74px; }

  /* Brand-guideline palette — sections made only of colors render as swatch cards */
  .section.open .group-body.palette {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;
    background: transparent; border: 0; border-radius: 0; overflow: visible;
  }
  .palette .row.sw { display: block; padding: 12px; border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface-2); }
  .palette .row.sw.hidden { display: none; }
  .palette .sw input[type=color] {
    display: block; width: 100%; height: 78px; padding: 0;
    border: 1px solid var(--hairline); border-radius: 8px; background: transparent; cursor: pointer;
  }
  .palette .sw input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .palette .sw input[type=color]::-webkit-color-swatch { border: none; border-radius: 7px; }
  .palette .sw input[type=color]::-moz-color-swatch { border: none; border-radius: 7px; }
  .palette .sw .sw-name { margin-top: 10px; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .palette .sw .sw-hex { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .palette .sw .sw-rgb { font-family: var(--mono); font-size: 11.5px; color: var(--muted); opacity: .8; }

  /* Type-specimen rows — Typography pane renders like a brand type sheet */
  .row.spec { grid-template-columns: minmax(110px, 170px) 1fr auto; }
  .row.spec .spec-size { font-family: var(--mono); font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }
  .row.spec .spec-prev { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
  .row.spec .spec-font-name { font-size: 26px; font-weight: 500; line-height: 1.25; }
  .row.spec .spec-sample { font-size: 15px; color: var(--muted); margin-top: 2px; letter-spacing: .03em; }

  .sliderctl { display: flex; align-items: center; gap: 10px; min-width: 220px; }
  .sliderctl input[type=range] { flex: 1; accent-color: var(--accent); }
  .sliderctl .val { font-family: var(--mono); font-size: 13px; color: var(--accent); min-width: 52px; text-align: right; }

  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; background: var(--hairline); border-radius: 999px; transition: .16s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: .16s; box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .switch input:checked + .track { background: var(--green); }
  .switch input:checked + .track::after { left: 18px; }

  .radiogrp { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 2px; }
  .radiogrp label { padding: 5px 13px; font-size: 13.5px; border-radius: 5px; cursor: pointer; color: var(--muted); }
  .radiogrp input { display: none; }
  .radiogrp label:has(input:checked) { background: var(--accent); color: #fff; }
  .radiogrp label:has(input:checked) span { color: #fff; }

  .chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); user-select: none;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .filectl {
    display: flex; align-items: center; gap: 9px; border: 1px dashed var(--border);
    border-radius: 7px; padding: 6px 11px; color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .filectl:hover { border-color: var(--accent); color: var(--text); }

  .fontrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .fontrow input { flex: 1; min-width: 0; }
  .fontrow .fr-name { max-width: 160px; }
  .fr-type { flex-shrink: 0; }
  .fr-del { cursor: pointer; opacity: .7; flex-shrink: 0; }
  .fr-del:hover { opacity: 1; }
  .fontactions { display: flex; gap: 8px; margin-top: 4px; }

  .imgrow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .imgrow .ir-name { flex: 1; min-width: 110px; font-family: var(--mono); font-size: 12px; }
  .imgrow .ir-num { width: 58px; min-width: 58px !important; }
  .imgrow .ir-u { min-width: 52px !important; width: 52px; padding: 6px 3px; }
  .imgrow .ir-fit { min-width: 88px !important; width: 88px; }
  .imgrow .ir-pos { min-width: 118px !important; width: 118px; }
  .ir-dot { color: var(--muted); font-family: var(--mono); font-weight: 700; }
  .ir-x { color: var(--muted); font-size: 11px; }
  .filectl .thumb { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #4f8ef7, #a855f7); }

  /* ===== Footer ===== */
  .footer {
    display: flex; align-items: center; gap: 10px; padding: 11px 22px;
    border-top: 1px solid var(--hairline); background: var(--sidebar); flex-shrink: 0;
  }
  .status { font-size: 13.5px; color: var(--muted); flex: 1; }
  .status.dirty { color: var(--amber); font-weight: 600; }
  .btn { border: 0; border-radius: 7px; padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn.save { background: var(--accent); color: #fff; }
  .btn.save:disabled { opacity: .4; cursor: not-allowed; }
  .btn.reset { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn.reset:hover { color: var(--red); border-color: var(--red); }

  .toast {
    position: fixed; bottom: 28px; right: 28px; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--green); border-left: 4px solid var(--green);
    border-radius: 10px; padding: 11px 16px; font-size: 12.5px; box-shadow: var(--shadow);
    opacity: 0; transform: translateY(12px); transition: .22s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; transform: none; }
  .no-results { color: var(--muted); text-align: center; padding: 40px 0; font-size: 13px; display: none; }
  .xpane-hint { text-align: center; color: var(--muted); font-size: 12.5px; padding: 14px 0 30px; }
  .xpane-hint .chip { margin: 0 3px; }

  /* Live preview strip */
  .btn-preview {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    padding: 22px 18px; border-radius: 9px;
  }
  .pv-btn { cursor: pointer; white-space: nowrap; }

  .img-preview { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; padding: 18px; }
  .img-pv-item { text-align: center; }
  .img-pv-box {
    background: linear-gradient(135deg, #4f8ef7, #a855f7);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; margin: 0 auto;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }
  .img-pv-name { font-family: var(--mono); font-size: 10.5px; margin-top: 6px; color: var(--text); }
  .img-pv-dims { font-size: 10px; color: var(--muted); margin-top: 1px; }

  .card-preview { padding: 24px; border-radius: 9px; }
  .pv-card { max-width: 320px; overflow: hidden; cursor: default; }

  /* Theme mini-app preview */
  .mini-app { display: flex; height: 170px; border-radius: 9px; overflow: hidden; border: 1px solid; }
  .mini-side { width: 46px; border-right: 1px solid; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
  .mini-side span { display: block; height: 10px; border-radius: 4px; }
  .mini-main { flex: 1; display: flex; flex-direction: column; }
  .mini-head { padding: 8px 14px; font-size: 11px; font-weight: 700; border-bottom: 1px solid; }
  .mini-content { flex: 1; padding: 14px; }
  .mini-card { border: 1px solid; border-radius: 8px; padding: 12px 14px; max-width: 260px; }
  .mini-card b { font-size: 13px; display: block; margin-bottom: 4px; }
  .mini-card p { font-size: 11.5px; margin: 2px 0; }

  /* Native shells for the theme preview — App Bar / Bottom Nav (Android),
     Nav Bar / Tab Bar / home indicator (iOS), side rail (TV) */
  .mini-app.mini-native { flex-direction: column; }
  .mini-appbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 12px; border-bottom: 1px solid; }
  .mini-appbar b { font-size: 12.5px; font-weight: 600; }
  .mini-fab { position: absolute; right: 14px; bottom: 14px; width: 34px; height: 34px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .mini-dock { margin-top: auto; border-top: 1px solid; }
  .mini-bottomnav { display: flex; padding: 6px 4px; }
  .mini-bottomnav .itm { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 8.5px; }
  .mini-bottomnav .itm i { font-style: normal; font-size: 13px; }
  .mini-homebar { width: 66px; height: 4px; border-radius: 99px; margin: 2px auto 6px; opacity: .6; }
  .mini-rail { width: 74px; padding: 14px 10px; display: flex; flex-direction: column; gap: 12px; font-size: 9.5px; border-right: 1px solid; }
  .mini-shelf { display: flex; gap: 8px; margin-top: 10px; }
  .mini-shelf span { flex: 1; height: 46px; border-radius: 6px; border: 1px solid; }

  .typo-preview { padding: 18px; display: flex; flex-direction: column; gap: 8px; }

  /* Layout wireframe preview */
  .lay-preview { border: 1px solid var(--hairline); border-radius: 9px; overflow: hidden; font-size: 10px; color: var(--muted); }
  .lay-head, .lay-foot { background: var(--sidebar); padding: 6px 12px; border-bottom: 1px solid var(--hairline); }
  .lay-foot { border-top: 1px solid var(--hairline); border-bottom: 0; }
  .lay-body { display: flex; min-height: 110px; }
  .lay-side { background: var(--sidebar); border-right: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lay-main { flex: 1; padding: 10px; }
  .lay-container { border: 1px dashed var(--accent); border-radius: 6px; padding: 8px; }
  .lay-label { margin-bottom: 6px; color: var(--accent); font-weight: 600; }
  .lay-grid { display: flex; }
  .lay-grid span { flex: 1; height: 34px; border-radius: 3px; }

  .nav-preview { max-width: 240px; border-radius: 9px; padding: 10px 8px; margin: 16px; }
  .nav-pv-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px; margin-bottom: 2px; }

  .form-preview, .table-preview, .alert-preview { padding: 20px; border-radius: 9px; margin: 0; }
  .pickable { cursor: pointer; border: 1.5px solid transparent; border-radius: 9px; padding: 6px 8px; transition: border-color .15s; }
  .pickable:hover { border-color: var(--border); }
  .pickable.sel { border-color: var(--accent); background: var(--accent-soft); }

  .opt-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .opt-card {
    border: 1px solid var(--hairline); border-radius: 11px;
    padding: 10px 12px 6px; margin-bottom: 12px; background: var(--surface-2);
  }
  .opt-card.sel { border-color: var(--accent); }
  .opt-card .opt-panel { margin: 4px 0 8px; }
  .opt-check {
    width: 23px; height: 23px; border-radius: 50%; border: 2px solid; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
  }
  .opt-panel {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin: 2px 0 16px; padding: 10px 14px;
    border: 1px dashed var(--accent); border-radius: 9px; background: var(--accent-soft);
  }
  .mini-ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .mini-ctl input[type=text] { min-width: 66px !important; width: 84px; padding: 4px 8px; font-size: 12.5px; }
  .mini-ctl input[type=color] { width: 28px; height: 22px; border: 1px solid var(--border); border-radius: 5px; background: transparent; padding: 1px; cursor: pointer; }
  .mini-ctl input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  .alert-preview { max-width: 460px; }

  .popup-preview { position: relative; height: 190px; border-radius: 9px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .popup-overlay { position: absolute; inset: 0; }
  .popup-box { position: relative; max-width: 280px; }

  /* Sub-tab toolbar (theme / device) inside a pane */
  .seg-toolbar {
    display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
    margin: 10px 4px 6px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline);
  }
  .seg-group .seg-caption {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 0 2px 5px;
  }
  .modeseg {
    display: inline-flex; gap: 2px; flex-wrap: wrap; max-width: 100%;
    background: var(--sidebar); border: 1px solid var(--hairline); border-radius: 9px; padding: 3px;

  .mode-btn {
    padding: 6px 17px; font-size: 13.5px; font-weight: 600; border-radius: 7px;
    cursor: pointer; color: var(--muted); user-select: none;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.on { background: var(--accent); color: #fff; }

// Scale px values (numbers, "10px 20px" strings, image class dimensions) for TV.
const scalePx=(v,s)=>{
  if(typeof v==='number') return Math.round(v*s*100)/100;
  if(typeof v==='string') return v.replace(/(-?\d+(?:\.\d+)?)px/g,(m,n)=>Math.round(n*s)+'px');
  return v;
};
const scaleField=(f,s)=>{
  if(!s||s===1) return f;
  if((f.t==='number'||f.t==='slider')&&f.u==='px'){
    f.v=scalePx(f.v,s);
    if(f.min!=null)f.min=scalePx(f.min,s);
    if(f.max!=null)f.max=scalePx(f.max,s);
  }
  else if(f.t==='text') f.v=scalePx(f.v,s);
  else if(f.t==='imglist'&&Array.isArray(f.v)) f.v.forEach(r=>{
    if(r.w!=='auto')r.w=scalePx(r.w,s);
    if(r.h!=='auto')r.h=scalePx(r.h,s);
  });
  return f;
};

// Build one settings tree per platform from the authored BASE_TABS + overrides.
const BASE_DEVICE_TAGS=['desktop','laptop','ipad','mobile'];
// Platforms flagged allDevices (TV) show the resolution sub-tabs on EVERY pane:
// untagged sections are duplicated per resolution with px values scaled, so
// 720p → 8K can hold different values. Theme-tagged (dark/light) and hidden
// (preview-edited) sections stay shared across resolutions.
const perDeviceAll=(p,nt)=>{
  if(!p.allDevices||nt.devices) return nt;
  nt.devices=p.devices.map(d=>({id:d.id,label:d.label}));
  const out=[];
  nt.sections.forEach(([sec,fields,tag,hide])=>{
    if(hide||tag){ out.push([sec,fields,tag,hide]); return; }
    p.devices.forEach(d=>out.push([sec,clone(fields).map(f=>scaleField(f,d.scale)),d.id,hide]));
  });
  nt.sections=out;
  return nt;
};
const PLAT_TABS={};
PLATFORMS.forEach(p=>{
  PLAT_TABS[p.id]=BASE_TABS.map(t=>{
    const ov=(PANE_OVERRIDES[p.id]||{})[t.id]||{};
    const nt={...t,sections:[]};
    if(ov.label) nt.label=ov.label;
    if(ov.desc) nt.desc=ov.desc;
    if('modes' in ov) nt.modes=ov.modes;
    if(t.devices) nt.devices=p.devices.map(d=>({id:d.id,label:d.label}));
    // Patches match by section name, or "name|tag" for one theme/device only.
    const applyPatch=(sec,tag,fs)=>{ const pv=ov.patch&&(ov.patch[sec+(tag?'|'+tag:'')]||ov.patch[sec]);
      if(pv) fs.forEach(f=>{ if(pv[f.l]!=null) f.v=pv[f.l]; }); return fs; };
    (ov.sections||t.sections).concat(ov.append||[]).forEach(([sec,fields,tag,hide])=>{
      if(!t.devices||!BASE_DEVICE_TAGS.includes(tag)){ nt.sections.push([sec,applyPatch(sec,tag,clone(fields)),tag,hide]); return; }
      p.devices.filter(d=>d.from===tag).forEach(d=>{
        nt.sections.push([sec,applyPatch(sec,tag,clone(fields).map(f=>scaleField(f,d.scale))),d.id,hide]);
      });
    });
    return perDeviceAll(p,nt);
  });
  // Splice in the platform's extra panes right after their anchor pane.
  (EXTRA_TABS[p.id]||[]).forEach(x=>{
    const nt=perDeviceAll(p,{...x,sections:x.sections.map(([sec,fields,tag,hide])=>[sec,clone(fields),tag,hide])});
    delete nt.after;
    const idx=PLAT_TABS[p.id].findIndex(t=>t.id===x.after);
    PLAT_TABS[p.id].splice(idx<0?PLAT_TABS[p.id].length:idx+1,0,nt);
  });
});

// Per-platform state: values, saved snapshot and sub-tab (theme/device) selection.
const platformState={}, platformSaved={}, platformUI={};
PLATFORMS.forEach(p=>{
  const st={}, ui={mode:{},device:{}};
  PLAT_TABS[p.id].forEach(t=>{ st[t.id]={}; t.sections.forEach(([sec,fields,mode])=>fields.forEach(f=>{
    f.k=(mode?mode+'__':'')+slug(sec)+'__'+slug(f.l);
    // Token includes the platform, and the section when the same label repeats across
    // sections (device ids like tv_4k already start with the platform — don't repeat it)
    const dup=t.sections.filter(s=>(s[2]||null)===(mode||null)&&s[1].some(x=>x.l===f.l)).length>1;
    const pfx=mode&&mode.indexOf(p.id+'_')===0?'':p.id+'_';
    f.tok='{{'+pfx+(mode?mode+'_':'')+(dup?slug(sec)+'_':'')+slug(f.l)+'}}';
    st[t.id][f.k]=clone(f.v);
  }));
    if(t.modes) ui.mode[t.id]=t.modes[0].id;
    if(t.devices) ui.device[t.id]=t.devices[0].id;
  });
  platformState[p.id]=st; platformSaved[p.id]=clone(st); platformUI[p.id]=ui;
});

function switchPlatform(pid){
  if(pid===activePlatform) return;
  if(isDirty(activeTab) && !confirm('You have unsaved changes on this pane.\nLeave without saving?')) return;
  if(isDirty(activeTab)) state[activeTab]=clone(saved[activeTab]); // discard on leave
  activePlatform=pid;

  tabMode=platformUI[pid].mode; tabDevice=platformUI[pid].device;

  searchEl.value='';
  renderPlatformBar(); renderSidebar(); renderContent(); syncFooter();
}

  if(!groups){ TABS.forEach(item); return; }
  const done=new Set();

    sblist.appendChild(c);

  TABS.filter(t=>!done.has(t.id)).forEach(item); // panes not in any group still show
}

/* ---------- controls ---------- */
function control(tabId,f){
  const v=state[tabId][f.k], wrap=document.createElement('div'); wrap.className='ctl';
  const set=val=>{ state[tabId][f.k]=val; onChange(); };
  const T=f.t;
  if(T==='color'){
    wrap.innerHTML=`<span class="colorctl"><input type="color" value="${v}"><span class="hex">${v}</span></span>`;
    const inp=wrap.querySelector('input');
    inp.oninput=()=>{ wrap.querySelector('.hex').textContent=inp.value; set(inp.value); };
  } else if(T==='number'){
    if(f.u==='px'){
      // Length fields: free unit choice (px / em / rem / % / vw / vh)
      const m=String(v).match(/^(-?[\d.]+)\s*([a-z%]*)$/i)||[];
      const num=m[1]!==undefined?m[1]:v, unit=(m[2]||'px');
      const UNITS=['px','em','rem','%','vw','vh','in'];
      wrap.innerHTML=`<input type="number" value="${num}" step="any"><select class="unit-sel">${UNITS.map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}</select>`;
      const inp=wrap.querySelector('input'), sel=wrap.querySelector('select');
      const upd=()=>set(inp.value+sel.value);
      inp.oninput=upd; sel.onchange=upd;
    } else {
      wrap.innerHTML=`<input type="number" value="${v}">${f.u?`<span class="unit">${f.u}</span>`:''}`;
      wrap.querySelector('input').oninput=e=>set(Number(e.target.value));
    }
  } else if(T==='slider'){
    const step=f.step||((f.max-f.min)<=6?1:(f.max-f.min<10?0.1:1));
    wrap.innerHTML=`<span class="sliderctl"><input type="range" min="${f.min}" max="${f.max}" step="${step}" value="${v}"><span class="val">${v}${f.u||''}</span></span>`;
    const inp=wrap.querySelector('input');
    inp.oninput=()=>{ wrap.querySelector('.val').textContent=inp.value+(f.u||''); set(Number(inp.value)); };
  } else if(T==='select'){
    wrap.innerHTML=`<select>${f.o.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
    wrap.querySelector('select').onchange=e=>set(e.target.value);
  } else if(T==='toggle'){
    wrap.innerHTML=`<label class="switch"><input type="checkbox" ${v?'checked':''}><span class="track"></span></label>`;
    wrap.querySelector('input').onchange=e=>set(e.target.checked);
  } else if(T==='radio'){
    wrap.innerHTML=`<span class="radiogrp">${f.o.map(o=>`<label><input type="radio" name="${f.k}" ${o==v?'checked':''}><span>${o}</span></label>`).join('')}</span>`;
    wrap.querySelectorAll('input').forEach((inp,i)=>inp.onchange=()=>set(f.o[i]));
  } else if(T==='multiselect'){
    const cur=new Set(v);
    wrap.innerHTML=`<span class="chips">${f.o.map(o=>`<span class="chip ${cur.has(o)?'on':''}" data-v="${o}">${o}</span>`).join('')}</span>`;
    wrap.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      const val=ch.dataset.v, s=new Set(state[tabId][f.k]);
      s.has(val)?s.delete(val):s.add(val);
      ch.classList.toggle('on'); set([...s]);
    });
  } else if(T==='file'){
    wrap.innerHTML=`<span class="filectl"><span class="thumb"></span><span>${v||'Choose file…'}</span> ⬆</span>`;
    wrap.querySelector('.filectl').onclick=()=>{
      const name=prompt('Mock upload — file name:',v||'file.png');
      if(name!==null){ wrap.querySelector('span span').textContent=name; set(name); }
    };
  } else if(T==='fonts'){
    wrap.style.flexDirection='column'; wrap.style.alignItems='stretch'; wrap.style.flex='1';
    const render=()=>{
      const list=state[tabId][f.k];
      wrap.innerHTML='';
      list.forEach((row,i)=>{
        const r=document.createElement('div'); r.className='fontrow';
        r.innerHTML=`<span class="fr-type" title="${row.type==='google'?'Google Font':'Uploaded font'}">${row.type==='google'?'🌐':'📁'}</span>
          <input type="text" class="fr-name" placeholder="Font name" value="${row.name}">
          <input type="text" class="fr-src" placeholder="${row.type==='google'?'https://fonts.googleapis.com/css2?family=…':'font file'}" value="${row.src}" ${row.type==='file'?'readonly':''}>
          <span class="fr-del" title="Remove">🗑</span>`;
        r.querySelector('.fr-name').oninput=e=>{ list[i].name=e.target.value; onChange(); };
        r.querySelector('.fr-src').oninput=e=>{ list[i].src=e.target.value; onChange(); };
        r.querySelector('.fr-del').onclick=()=>{ list.splice(i,1); onChange(); render(); };
        wrap.appendChild(r);
      });
      const actions=document.createElement('div'); actions.className='fontactions';
      actions.innerHTML=`<span class="chip">+ Google Font URL</span><span class="chip">⬆ Upload Font</span>`;
      const [g,u]=actions.querySelectorAll('.chip');
      g.onclick=()=>{ list.push({type:'google',name:'',src:''}); onChange(); render(); };
      u.onclick=()=>{ const n=prompt('Mock upload — font file name:','MyFont.woff2');
        if(n){ list.push({type:'file',name:n.replace(/\.[^.]+$/,''),src:n}); onChange(); render(); } };
      wrap.appendChild(actions);
    };
    render();
  } else if(T==='imglist'){
    wrap.style.flexDirection='column'; wrap.style.alignItems='stretch'; wrap.style.flex='1';
    const FITS=['cover','contain','fill','none','scale-down'];
    const POSITIONS=['center center','top center','bottom center','center left','center right','top left','top right','bottom left','bottom right'];
    const render=()=>{
      const list=state[tabId][f.k];
      wrap.innerHTML='';
      list.forEach((row,i)=>{
        const r=document.createElement('div'); r.className='imgrow';

        const uSel=(cls,cur)=>`<select class="ir-u ${cls}" title="unit">${UN.map(u=>`<option ${u===(cur||'px')?'selected':''}>${u}</option>`).join('')}</select>`;
        r.innerHTML=`<span class="ir-dot">.</span><input type="text" class="ir-name" placeholder="class-name" value="${row.name}">
          <input type="text" class="ir-num ir-w" value="${dim(row.w)}" placeholder="auto" title="Width — number or auto">${uSel('ir-wu',row.wu)}<span class="ir-x">×</span>
          <input type="text" class="ir-num ir-h" value="${dim(row.h)}" placeholder="auto" title="Height — number or auto">${uSel('ir-hu',row.hu)}
          <select class="ir-fit" title="object-fit">${FITS.map(o=>`<option ${o===row.fit?'selected':''}>${o}</option>`).join('')}</select>
          <select class="ir-pos" title="object-position">${POSITIONS.map(o=>`<option ${o===(row.pos||'center center')?'selected':''}>${o}</option>`).join('')}</select>
          <span class="fr-del" title="Remove">🗑</span>`;
        const parseDim=s=>{ s=s.trim().toLowerCase(); return s==='auto'||s===''?'auto':(isNaN(Number(s))?'auto':Number(s)); };
        r.querySelector('.ir-name').oninput=e=>{ list[i].name=e.target.value; onChange(); };
        r.querySelector('.ir-w').oninput=e=>{ list[i].w=parseDim(e.target.value); onChange(); };
        r.querySelector('.ir-h').oninput=e=>{ list[i].h=parseDim(e.target.value); onChange(); };
        r.querySelector('.ir-wu').onchange=e=>{ list[i].wu=e.target.value; onChange(); };
        r.querySelector('.ir-hu').onchange=e=>{ list[i].hu=e.target.value; onChange(); };
        r.querySelector('.ir-fit').onchange=e=>{ list[i].fit=e.target.value; onChange(); };
        r.querySelector('.ir-pos').onchange=e=>{ list[i].pos=e.target.value; onChange(); };
        r.querySelector('.fr-del').onclick=()=>{ list.splice(i,1); onChange(); render(); };
        wrap.appendChild(r);
      });
      const actions=document.createElement('div'); actions.className='fontactions';
      actions.innerHTML=`<span class="chip">+ Add Image Class</span>`;
      actions.querySelector('.chip').onclick=()=>{ list.push({name:'',w:300,h:200,fit:'cover'}); onChange(); render(); };
      wrap.appendChild(actions);
    };
    render();
  } else if(T==='textarea'){
    wrap.style.flex='1'; wrap.innerHTML=`<textarea>${v}</textarea>`;
    wrap.querySelector('textarea').oninput=e=>set(e.target.value);
  } else {
    wrap.innerHTML=`<input type="${T}" value="${v}">`;
    wrap.querySelector('input').oninput=e=>set(e.target.value);
  }
  return wrap;
}

/* Brand-palette swatch card — used instead of a row when a section is all colors */
const hexToRgb=h=>{ const m=String(h).replace('#',''); const n=(m.length===3?m.split('').map(c=>c+c).join(''):m).slice(0,6);
  const i=parseInt(n,16); return isNaN(i)?'':`RGB ${(i>>16)&255} ${(i>>8)&255} ${i&255}`; };
function swatchCard(tabId,f,sec){
  const v=state[tabId][f.k];
  const card=document.createElement('div'); card.className='row sw';
  card.dataset.search=(sec+' '+f.l).toLowerCase();
  if(f.h) card.title=f.h;
  card.innerHTML=`<input type="color" value="${v}">
    <div class="sw-name">${f.l}</div><div class="sw-hex">${v}</div><div class="sw-rgb">${hexToRgb(v)}</div>`;
  const inp=card.querySelector('input');
  inp.oninput=()=>{ card.querySelector('.sw-hex').textContent=inp.value;
    card.querySelector('.sw-rgb').textContent=hexToRgb(inp.value);
    state[tabId][f.k]=inp.value; onChange(); };
  return card;
}

/* Type-specimen row — Typography's Font Family / Size / Weight render like a type sheet */
const SPEC_TEXT={'H1 (Title)':'Heading One','H2':'Heading Two','H3':'Heading Three','H4':'Heading Four',
  'H5':'Heading Five','H6':'Heading Six','Paragraph (Body)':'Paragraph Text','Small Text':'Small Text'};
const SPEC_ABC='ABCDEFGHIJKLM abcdefghijklm 0123456789';
function specRow(sec,f){
  const row=document.createElement('div'); row.className='row spec';
  row.dataset.search=(sec+' '+f.l).toLowerCase();
  const lbl=document.createElement('div'); lbl.className='lbl';
  const prev=document.createElement('div'); prev.className='spec-prev';
  const tf=k=>state['typography']['font_family__'+k]||'';
  const upd=()=>{
    const v=state['typography'][f.k];
    if(sec==='Font Family'){
      lbl.innerHTML=`<b>${f.l}</b>`;
      prev.innerHTML=`<div class="spec-font-name" style="font-family:'${v}',sans-serif">${v}</div>
        <div class="spec-sample" style="font-family:'${v}',sans-serif">${SPEC_ABC}</div>`;
    } else if(sec==='Font Size'){
      const size=lenv(v), isH=/^H\d/.test(f.l), fam=tf(isH?'heading_font':'body_font');
      lbl.innerHTML=`<b>${f.l.replace(/\s*\(.*\)$/,'')}</b><span class="spec-size">${size}</span>`;
      prev.innerHTML=`<div style="font-family:'${fam}',sans-serif;font-size:${size};font-weight:${isH?700:400};line-height:1.15">${SPEC_TEXT[f.l]||f.l}</div>`;
    } else { // Font Weight
      lbl.innerHTML=`<b>${f.l}</b><span class="spec-size">${v}</span>`;
      prev.innerHTML=`<div class="spec-sample" style="font-family:'${tf('body_font')}',sans-serif;font-weight:${v};font-size:16px;color:var(--text)">${SPEC_ABC}</div>`;
    }
  };
  upd();
  row.append(lbl,prev,control('typography',f));
  row.addEventListener('input',upd);
  // Changing a typeface re-renders the pane so every specimen picks up the new font.
  row.addEventListener('change',()=>{ sec==='Font Family'?renderContent():upd(); });
  return row;
}

/* ---------- content ---------- */
function renderContent(){
  const t=TABS.find(x=>x.id===activeTab);
  const plat=PLATFORMS.find(p=>p.id===activePlatform);
  paneHead.innerHTML=`<h1>${t.label}</h1><p><b style="color:var(--accent)">${plat.label}</b> · ${t.desc}</p>`;
  content.innerHTML='';
  // Sub-tab toolbar: theme (t.modes) and/or device (t.devices)
  if(t.modes||t.devices){
    const bar=document.createElement('div'); bar.className='seg-toolbar';
    const makeSeg=(caption,list,store)=>{
      const grp=document.createElement('div'); grp.className='seg-group';
      const seg=document.createElement('div'); seg.className='modeseg';
      seg.innerHTML=list.map(m=>
        `<span class="mode-btn ${store[t.id]===m.id?'on':''}" data-m="${m.id}">${m.label}</span>`).join('');
      seg.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{
        store[t.id]=b.dataset.m; renderContent();
      });
      grp.innerHTML=`<div class="seg-caption">${caption}</div>`;
      grp.appendChild(seg); bar.appendChild(grp);
    };
    if(t.devices){ // device on top; orientation legend only where devices rotate
      const cap=t.devices.some(d=>/[↔↕]/.test(d.label))?'Device · ↔ horizontal / ↕ vertical':'Device / Resolution';
      makeSeg(cap,t.devices,tabDevice);
    }
    if(t.modes) makeSeg('Theme',t.modes,tabMode);        // theme below
    content.appendChild(bar);
  }
  t.sections.forEach(([sec,fields,tag,hide])=>{
    if(hide) return; // edited inline in the live preview
    if(tag){
      const isTheme=t.modes&&t.modes.some(m=>m.id===tag);
      const isDev=t.devices&&t.devices.some(d=>d.id===tag);
      if(isTheme && tag!==tabMode[t.id]) return;
      if(isDev && tag!==tabDevice[t.id]) return;
    }
    const s=document.createElement('div'); s.className='section open';
    s.innerHTML=`<div class="group-label"><span class="chev">▶</span>${sec}</div><div class="group-body"></div>`;
    s.querySelector('.group-label').onclick=()=>s.classList.toggle('open');
    const body=s.querySelector('.group-body');
    if(fields.length&&fields.every(f=>f.t==='color')) body.classList.add('palette');
    fields.forEach(f=>{
      if(body.classList.contains('palette')){ body.appendChild(swatchCard(activeTab,f,sec)); return; }
      if(activeTab==='typography'&&['Font Family','Font Size','Font Weight'].includes(sec)){
        body.appendChild(specRow(sec,f)); return;
      }
      const row=document.createElement('div'); row.className='row'; row.dataset.search=(sec+' '+f.l).toLowerCase();
      const lbl=document.createElement('div'); lbl.className='lbl';
      lbl.innerHTML=`<b>${f.l}</b>${f.h?`<span>${f.h}</span>`:''}`;
      row.append(lbl, control(activeTab,f)); body.appendChild(row);
    });
    content.appendChild(s);
  });
  const nr=document.createElement('div'); nr.className='no-results'; nr.id='noResults';
  nr.textContent='No settings match your search in this pane.'; content.appendChild(nr);
  const xh=document.createElement('div'); xh.className='xpane-hint'; xh.id='xpaneHint';
  content.appendChild(xh);
  applySearch();
  renderPreviewPanel();
}

/* ---------- right preview panel: pane preview inside a platform device frame ---------- */

  if(activePlatform==='tv')
    return `<div class="dev-tv"><div class="dev-tv-screen">${inner}</div></div><div class="dev-tv-stand"></div><div class="dev-tv-base"></div>`;
  if(activePlatform==='android')

/* ---------- search (current pane) ---------- */
function applySearch(){
  const q=searchEl.value.trim().toLowerCase();
  let any=false;
  content.querySelectorAll('.section:not(.no-search)').forEach(sec=>{
    let vis=0;
    sec.querySelectorAll('.row').forEach(r=>{
      const show=!q||r.dataset.search.includes(q);
      r.classList.toggle('hidden',!show); if(show) vis++;
    });
    sec.style.display=vis?'':'none';
    if(q&&vis) sec.classList.add('open');
    if(vis) any=true;
  });
  const nr=$('#noResults'); if(nr) nr.style.display=any?'none':'block';
  // Cross-pane hits: searching "chips" from any pane points to the pane that has it.
  const hint=$('#xpaneHint');
  if(hint){
    if(!q){ hint.innerHTML=''; }
    else{
      const others=[];
      TABS.forEach(t=>{ if(t.id===activeTab) return; let n=0;
        t.sections.forEach(([sec2,fields,tag,hide])=>{ if(hide) return;
          fields.forEach(f=>{ if(f.t!=='heading'&&(sec2+' '+f.l).toLowerCase().includes(q)) n++; }); });
        if(n) others.push([t,n]); });
      hint.innerHTML=others.length
        ?'Also found in: '+others.map(([t,n])=>`<span class="chip" data-t="${t.id}">${t.icon} ${t.label} (${n})</span>`).join('')
        :'';
      hint.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
        const qq=searchEl.value; switchTab(ch.dataset.t);
        searchEl.value=qq; applySearch();
      });
    }
  }
}
searchEl.oninput=applySearch;

function updateFormPreview(){
  const el=document.getElementById('formPreviewBody'); if(!el) return;
  const m=tabMode['forms'], s=state['forms'], g=k=>s[k];
  const ok=g(m+'__validation_colors__validation_success'), err=g(m+'__validation_colors__validation_error');
  const paneBg=m==='dark'?'#1e1e20':'#eef0f4', lbl=m==='dark'?'#f2f2f5':'#1d1d21';
  const fc=m==='dark'?'#4f8ef7':'#0a66f0', bd=m==='dark'?'#3d3d42':'#d8d8dd', ph=m==='dark'?'#8a8a92':'#9a9aa2';
  const inpStyles=g('input_styles__input_styles')||[];
  const inpStyle=inpStyles[0]||'Full Border'; // first selected drives the focused example
  // per-style parameter reader — every style has its OWN settings + colors
  const SP=st=>{ const b=slug(st), gg=k=>g(b+'_settings__'+k), gc=k=>g(m+'__'+b+'_colors__'+k);
    return { h:lenv(gg('height')), fs:lenv(gg('font_size')), pad:gg('padding'), rad:lenv(gg('radius')),
      bw:lenv(gg('border_width')), ff:gg('font_family'), lfs:lenv(gg('label_font_size')),
      bg:gc('background_color'), tc:gc('text_color'), bd:gc('border_color'), fc:gc('focus_color'), ph:gc('placeholder_color') }; };
  const boxCss=(st,p,focused)=>{
    const edge=focused?p.fc:p.bd, bw=p.bw==='0px'||!p.bw?'1.5px':p.bw;
    if(st==='Underline') return `background:transparent;border:0;border-bottom:${bw} solid ${edge};border-radius:0;`;
    if(st==='Filled')    return `background:${p.bg};border:${focused?`${bw} solid ${p.fc}`:'0'};border-radius:${p.rad};`;
    return `background:${p.bg};border:${bw} solid ${edge};border-radius:${p.rad};`; // Full Border / Filled + Border
  };
  const sample=(st,focused,val)=>{ const p=SP(st);
    return `<div style="height:${p.h};${boxCss(st,p,focused)}display:flex;align-items:center;padding:${p.pad};font-size:${p.fs};font-family:'${p.ff}',sans-serif;color:${val?p.tc:p.ph}">${val||'Placeholder text…'}</div>`; };
  // Mini inline controls shown inside the selected style's panel
  const miniCtl=(k,label,type,opts)=>{
    const v=state['forms'][k];
    const field=type==='color'?`<input type="color" data-mk="${k}" data-mt="color" value="${v}">`
      :type==='check'?`<input type="checkbox" data-mk="${k}" data-mt="check" ${v?'checked':''}>`
      :type==='sel'?`<select data-mk="${k}" data-mt="sel" style="min-width:90px !important;width:auto;padding:4px 6px;font-size:12.5px">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`
      :`<input type="text" data-mk="${k}" data-mt="${type}" value="${v}">`;
    return `<label class="mini-ctl"><span>${label}</span>${field}</label>`;
  };
  const check=sel=>`<span class="opt-check" style="border-color:${sel?fc:bd};background:${sel?fc:'transparent'}">${sel?'✓':''}</span>`;
  // Each style, one after another — checking a card opens ITS OWN editable settings
  const editPanel=st=>{ const b=slug(st);
    return `<div class="opt-panel">
      ${miniCtl(b+'_settings__height','Height','len')}${miniCtl(b+'_settings__font_size','Font size','len')}${miniCtl(b+'_settings__padding','Padding','text')}${miniCtl(b+'_settings__radius','Radius','len')}${miniCtl(b+'_settings__border_width','Border width','len')}${miniCtl(b+'_settings__font_family','Font','sel',FONTS)}${miniCtl(b+'_settings__label_font_size','Label size','len')}${miniCtl(b+'_settings__label_position','Label','sel',['Top','Left','Floating'])}
    </div>
    <div class="opt-panel">
      ${miniCtl(m+'__'+b+'_colors__background_color','Background','color')}${miniCtl(m+'__'+b+'_colors__text_color','Text','color')}${miniCtl(m+'__'+b+'_colors__border_color','Border','color')}${miniCtl(m+'__'+b+'_colors__focus_color','Focus','color')}${miniCtl(m+'__'+b+'_colors__placeholder_color','Placeholder','color')}
    </div>`; };
  const inputOpt=st=>{
    const sel=inpStyles.includes(st), p=SP(st);
    return `<div class="opt-card ${sel?'sel':''}">
      <div class="opt-row pickable" data-k="input_styles__input_styles" data-v="${st}" data-multi="1">
        <div style="flex:1">
          <div style="color:${sel?fc:lbl};font-size:${p.lfs};font-family:'${p.ff}',sans-serif;font-weight:600;margin-bottom:4px">${st}${sel?' ✓ selected':''}</div>
          ${sample(st,false,'')}
        </div>${check(sel)}</div>
      ${sel?editPanel(st):''}</div>`;
  };
  const allInputs=['Full Border','Underline','Filled','Filled + Border'].map(inputOpt).join('');

  // Choice controls — checkbox / radio / switch styles
  const cbStyle=g('choice_controls__checkbox_style'), rdStyle=g('choice_controls__radio_button_style'),
        swStyle=g('choice_controls__switch_style'), swLabels=g('choice_controls__show_on_off_labels');
  const chk=g(m+'__checkbox_radio_colors__checked_color'), cbd=g(m+'__checkbox_radio_colors__border_color'),
        ico=g(m+'__checkbox_radio_colors__check_icon_color');
  const son=g(m+'__switch_colors__switch_on_color'), soff=g(m+'__switch_colors__switch_off_color'),
        knob=g(m+'__switch_colors__knob_color');
  const checkbox=(on,style)=>{
    const rad=style==='Square'?'3px':style==='Circle'?'50%':'6px';
    const box=`display:inline-flex;width:21px;height:21px;border-radius:${rad};align-items:center;justify-content:center;font-size:13px;font-weight:700;`;
    if(!on) return `<span style="${box}${style==='Tick Only'?'':`border:2px solid ${cbd}`}"></span>`;
    if(style==='Outline Tick') return `<span style="${box}border:2px solid ${chk};color:${chk}">✓</span>`;
    if(style==='Tick Only')    return `<span style="${box}color:${chk};font-size:19px">✓</span>`;
    if(style==='Cross')        return `<span style="${box}background:${chk};color:${ico}">✕</span>`;
    return `<span style="${box}background:${chk};color:${ico}">✓</span>`; // Square / Rounded / Circle
  };
  const radio=(on,style)=>{
    const base=`display:inline-flex;width:21px;height:21px;align-items:center;justify-content:center;`;
    const shape=style==='Square Dot'?'border-radius:5px;':style==='Diamond'?'border-radius:4px;transform:rotate(45deg);':'border-radius:50%;';
    if(!on) return `<span style="${base}${shape}border:2px solid ${cbd}"></span>`;
    if(style==='Dot')        return `<span style="${base}${shape}border:2px solid ${chk}"><span style="width:9px;height:9px;border-radius:50%;background:${chk}"></span></span>`;
    if(style==='Check')      return `<span style="${base}${shape}background:${chk};color:${ico};font-size:12px;font-weight:700">✓</span>`;
    if(style==='Ring')       return `<span style="${base}${shape}border:6px solid ${chk}"></span>`;
    if(style==='Square Dot'||style==='Diamond') return `<span style="${base}${shape}border:2px solid ${chk}"><span style="width:9px;height:9px;border-radius:2px;background:${chk}"></span></span>`;
    return `<span style="${base}${shape}background:${chk};box-shadow:inset 0 0 0 3px ${paneBg}"></span>`; // Filled
  };
  // one sample per style — click to select
  const styleRow=(styles,cur,make,key)=>styles.map(st=>
    `<span class="pickable ${st===cur?'sel':''}" data-k="${key}" data-v="${st}" style="display:inline-flex;flex-direction:column;align-items:center;gap:3px;margin-right:4px">
      ${make(true,st)}<span style="font-size:9.5px;color:${st===cur?fc:ph};font-weight:${st===cur?'700':'400'}">${st}${st===cur?' ✓':''}</span></span>`).join('');
  const CB_STYLES=['Square','Rounded','Circle','Outline Tick','Tick Only','Cross'];
  const RD_STYLES=['Dot','Filled','Check','Ring','Square Dot','Diamond'];
  const SW_STYLES=['Pill','Square','iOS'];
  const sw=(on,style)=>{
    const swStyle=style||g('choice_controls__switch_style');
    const rad=swStyle==='Square'?'5px':'999px', W=swStyle==='iOS'?52:46, H=swStyle==='iOS'?28:24, K=H-6;
    const label=swLabels?`<span style="color:${knob};font-size:9px;font-weight:800;letter-spacing:.04em;position:absolute;${on?'left:7px':'right:6px'};top:50%;transform:translateY(-50%)">${on?'ON':'OFF'}</span>`:'';
    return `<span style="position:relative;display:inline-block;width:${W}px;height:${H}px;border-radius:${rad};background:${on?son:soff};box-shadow:inset 0 1px 3px rgba(0,0,0,.15)">${label}
      <span style="position:absolute;top:3px;${on?`right:3px`:`left:3px`};width:${K}px;height:${K}px;border-radius:${swStyle==='Square'?'4px':'50%'};background:${knob};box-shadow:0 1px 3px rgba(0,0,0,.35)"></span></span>`;
  };
  const rowL=(name,html)=>`<div style="display:flex;align-items:flex-start;gap:14px;margin-top:14px"><span style="color:${lbl};font-size:12px;font-weight:600;width:90px;flex-shrink:0;padding-top:2px">${name}</span><span style="display:flex;flex-wrap:wrap;align-items:flex-start">${html}</span></div>`;

  const swRow=SW_STYLES.map(st=>
    `<span class="pickable ${st===swStyle?'sel':''}" data-k="choice_controls__switch_style" data-v="${st}" style="display:inline-flex;flex-direction:column;align-items:center;gap:3px;margin-right:4px">
      ${sw(true,st)}<span style="font-size:9.5px;color:${st===swStyle?fc:ph};font-weight:${st===swStyle?'700':'400'}">${st}${st===swStyle?' ✓':''}</span></span>`).join('');

  const cbPanel=`<div class="opt-panel">${miniCtl(m+'__checkbox_radio_colors__checked_color','Checked','color')}${miniCtl(m+'__checkbox_radio_colors__border_color','Border','color')}${miniCtl(m+'__checkbox_radio_colors__check_icon_color','Icon','color')}</div>`;
  const swPanel=`<div class="opt-panel">${miniCtl(m+'__switch_colors__switch_on_color','On','color')}${miniCtl(m+'__switch_colors__switch_off_color','Off','color')}${miniCtl(m+'__switch_colors__knob_color','Knob','color')}${miniCtl('choice_controls__show_on_off_labels','ON/OFF labels','check')}</div>`;

  // ---- a REAL app form inside the device frame — built from the selected style ----
  const br=state['branding']||{}, bt=state['buttons']||{};
  const appBg=br[m+'__surfaces__background_color']||paneBg;
  const hd=br[m+'__surfaces__header_color']||paneBg;
  const t1c=br[m+'__text_interaction__text_primary']||lbl;
  const btnBg=bt[m+'__primary_button__background_color']||bt[m+'__filled_button__background_color']||fc;
  const btnTc=bt[m+'__primary_button__text_color']||bt[m+'__filled_button__text_color']||'#ffffff';
  const field=(label,{val,phText,focused,error,help}={})=>{ const st=inpStyle, p=SP(st);
    const lp=g(slug(st)+'_settings__label_position')||'Top';
    const caret=focused?`<span style="display:inline-block;width:1.5px;height:60%;background:${p.fc};margin-left:2px"></span>`:'';
    const float=lp==='Floating'?`<span style="position:absolute;top:-7px;left:10px;background:${st==='Underline'?appBg:p.bg};padding:0 5px;font-size:10px;color:${focused?p.fc:p.ph}">${label}</span>`:'';
    const box=`<div style="position:relative;height:${p.h};${boxCss(st,p,focused)}display:flex;align-items:center;padding:${p.pad};font-size:${p.fs};font-family:'${p.ff}',sans-serif;color:${val?p.tc:p.ph}">${val||phText||''}${caret}${float}</div>`;
    const msg=error?`<div style="color:${err};font-size:10.5px;margin-top:4px">${error}</div>`
      :help?`<div style="color:${ok};font-size:10.5px;margin-top:4px">✓ ${help}</div>`:'';
    if(lp==='Left') return `<div style="margin-bottom:13px;display:flex;align-items:center;gap:10px"><span style="width:64px;flex-shrink:0;font-size:${p.lfs};color:${t1c};font-weight:600">${label}</span><div style="flex:1">${box}${msg}</div></div>`;
    return `<div style="margin-bottom:13px">${lp==='Floating'?'':`<span style="display:block;font-size:${p.lfs};color:${t1c};font-weight:600;margin-bottom:5px">${label}</span>`}${box}${msg}</div>`;
  };
  const iosP=activePlatform==='ios';
  const appbar=iosP
    ?`<div style="display:flex;align-items:center;padding:11px 12px;background:${hd};color:${t1c};border-bottom:1px solid ${bd}"><span style="color:${fc};font-size:15px;line-height:1">‹</span><b style="flex:1;text-align:center;font-size:12.5px">Create Account</b><span style="width:10px"></span></div>`
    :`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:${hd};color:${t1c};border-bottom:1px solid ${bd}"><span>←</span><b style="font-size:12.5px">Create Account</b><span style="margin-left:auto">⋮</span></div>`;
  el.style.flex='1'; el.style.display='flex'; el.style.flexDirection='column';
  el.innerHTML=`<div style="background:${appBg};display:flex;flex-direction:column;flex:1">
    ${appbar}
    <div style="padding:16px 14px">
      ${field('Full Name',{val:'Alex Carter',help:'Looks good'})}
      ${field('Email',{val:'alex@',focused:true})}
      ${field('Password',{phText:'Min. 8 characters',error:'✕ This field is required'})}
      <div style="display:flex;align-items:center;gap:10px;margin:14px 0">${checkbox(true,cbStyle)}<span style="font-size:11.5px;color:${t1c}">I agree to the Terms &amp; Privacy Policy</span></div>
      <div style="display:flex;gap:16px;align-items:center;margin:12px 0">
        <span style="display:flex;align-items:center;gap:6px">${radio(true,rdStyle)}<span style="font-size:11.5px;color:${t1c}">Personal</span></span>
        <span style="display:flex;align-items:center;gap:6px">${radio(false,rdStyle)}<span style="font-size:11.5px;color:${t1c}">Business</span></span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0">
        <span style="font-size:11.5px;color:${t1c}">Enable notifications</span>${sw(true,swStyle)}
      </div>
      <div style="height:44px;border-radius:12px;background:${btnBg};color:${btnTc};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-top:14px">Sign Up</div>
    </div></div>`;

  // ---- style picker + quick settings live OUTSIDE the frame, below the device ----
  const panel=document.getElementById('previewPanel');
  let ed=panel&&panel.querySelector('#formEditor');
  if(panel&&!ed){ ed=document.createElement('div'); ed.id='formEditor';
    panel.insertBefore(ed,panel.querySelector('.pv-note')); }
  if(ed) ed.innerHTML=`<div class="form-preview" style="background:${paneBg};margin-top:14px">
    <div style="color:${fc};font-size:12.5px;font-weight:600;margin-bottom:12px">👆 Click a style to select it — the form above updates; quick settings open below it.</div>
    ${allInputs}
    ${rowL('Checkboxes',styleRow(CB_STYLES,cbStyle,checkbox,'choice_controls__checkbox_style')+`<span style="margin-top:4px">${checkbox(false,cbStyle)}</span>`)}
    ${rowL('Radios',styleRow(RD_STYLES,rdStyle,radio,'choice_controls__radio_button_style')+`<span style="margin-top:4px">${radio(false,rdStyle)}</span>`)}
    ${cbPanel}
    ${rowL('Switches',swRow+`<span style="margin-top:4px">${sw(false,swStyle)}</span>`)}
    ${swPanel}
  </div>`;
  // clicking a sample selects it — multi-select (checkbox) keys toggle, others set
  [el,ed].filter(Boolean).forEach(root=>{
    root.querySelectorAll('[data-k]').forEach(n=>n.onclick=()=>{
      const k=n.dataset.k, v=n.dataset.v;
      if(n.dataset.multi){
        const cur=new Set(state['forms'][k]||[]);
        cur.has(v)?cur.delete(v):cur.add(v);
        state['forms'][k]=[...cur];
      } else state['forms'][k]=v;
      renderContent(); onChange();
    });
    // inline quick settings commit on change
    root.querySelectorAll('[data-mk]').forEach(inp2=>{
      inp2.onchange=()=>{
        let v=inp2.dataset.mt==='check'?inp2.checked:inp2.value;
        if(inp2.dataset.mt==='len'&&v!==''&&!isNaN(Number(v))) v=Number(v);
        state['forms'][inp2.dataset.mk]=v; renderContent(); onChange();
      };
    });
  });
}

    <div style="color:${d_b};font-size:10.5px;margin-top:4px">Material dialog body text goes here.</div>
    <div style="text-align:right;margin-top:10px;color:${d_a};font-size:11px;font-weight:700">CANCEL&nbsp;&nbsp;&nbsp;OK</div></div>`;
  const sheet=`<div style="position:absolute;left:0;right:0;bottom:0;background:${bs_bg};border-radius:${bsR} ${bsR} 0 0;height:84px;padding:8px 14px">
    ${handle?`<div style="width:32px;height:4px;border-radius:99px;background:${bs_h};margin:0 auto 8px"></div>`:''}
    <b style="color:${d_t};font-size:11.5px">Bottom sheet</b>
    <div style="color:${d_b};font-size:10px;margin-top:3px">Sheet content preview…</div></div>`;
  el.innerHTML=`<div style="display:flex;gap:18px;flex-wrap:wrap;padding:18px;background:${pane};border-radius:9px">
    ${miniScreen(dialog,'Dialog',scrim,scrimOp)}${miniScreen(sheet,'Bottom sheet',scrim,scrimOp)}</div>`;
}

function popupPreviewIOS(el){
  const s=state['popup'], m=tabMode['popup'], g=k=>s[k];
  const aR=lenv(g('alert_dialog__corner_radius')), stacked=g('alert_dialog__button_layout')==='Stacked';
  const bg=g(m+'__alert_colors__background_color'), t=g(m+'__alert_colors__title_color'),
        msg=g(m+'__alert_colors__message_color'), act=g(m+'__alert_colors__action_color'), des=g(m+'__alert_colors__destructive_color');
  const grab=g('sheet_modal__show_grabber'), shR=lenv(g('sheet_modal__corner_radius'));
  const dim=(Number(g('overlay__dim_opacity'))||40)/100;
  const pane=m==='dark'?'#1e1e20':'#eef0f4';
  const sepc=m==='dark'?'#ffffff22':'#00000022';
  const btns=stacked
    ?`<div style="border-top:1px solid ${sepc};padding:6px;color:${act};font-weight:600;text-align:center;font-size:12px">OK</div><div style="border-top:1px solid ${sepc};padding:6px;color:${des};text-align:center;font-size:12px">Delete</div>`
    :`<div style="display:flex;border-top:1px solid ${sepc}"><div style="flex:1;padding:6px;color:${des};text-align:center;font-size:12px;border-right:1px solid ${sepc}">Delete</div><div style="flex:1;padding:6px;color:${act};font-weight:600;text-align:center;font-size:12px">OK</div></div>`;
  const alert=`<div style="position:absolute;left:30px;right:30px;top:28px;background:${bg};border-radius:${aR};overflow:hidden">
    <div style="padding:12px 12px 8px;text-align:center"><b style="color:${t};font-size:12px">Alert Title</b>
    <div style="color:${msg};font-size:10.5px;margin-top:3px">Alert message text.</div></div>${btns}</div>`;
  const sheet=`<div style="position:absolute;left:0;right:0;bottom:0;background:${bg};border-radius:${shR} ${shR} 0 0;height:84px;padding:6px 12px">
    ${grab?`<div style="width:34px;height:4px;border-radius:99px;background:${msg};opacity:.5;margin:0 auto 8px"></div>`:''}
    <b style="color:${t};font-size:11.5px">Sheet</b>
    <div style="color:${msg};font-size:10px;margin-top:2px">Detents: ${g('sheet_modal__detents')}</div></div>`;
  el.innerHTML=`<div style="display:flex;gap:18px;flex-wrap:wrap;padding:18px;background:${pane};border-radius:9px">
    ${miniScreen(alert,'Alert dialog','#000000',dim)}${miniScreen(sheet,'Modal sheet','#000000',dim)}</div>`;
}

function updatePopupPreview(){
  const el=document.getElementById('popupPreviewBody'); if(!el) return;
  if(activePlatform==='android') return popupPreviewAndroid(el);
  if(activePlatform==='ios') return popupPreviewIOS(el);
  const m=tabMode['popup'], g=k=>gv('popup',k);
  const bg=g(m+'__popup_colors__background_color'), tc=g(m+'__popup_colors__text_color'),
        bd=g(m+'__popup_colors__border_color'), ov=g(m+'__popup_colors__overlay_color'), cl=g(m+'__popup_colors__close_icon_color');
  const br=lenv(g('size_shape__border_radius')), pad=lenv(g('size_shape__padding')), sh=g('size_shape__box_shadow');
  const op=(Number(g('overlay__overlay_opacity'))||60)/100;
  const paneBg=m==='dark'?'#1e1e20':'#eef0f4';
  el.innerHTML=`<div class="popup-preview" style="background:${paneBg}">
    <div class="popup-overlay" style="background:${ov};opacity:${op}"></div>
    <div class="popup-box" style="background:${bg};border:1px solid ${bd};border-radius:${br};padding:${pad};box-shadow:${sh}">
      <span style="position:absolute;top:8px;right:12px;color:${cl};cursor:pointer">✕</span>
      <b style="color:${tc};font-size:14px">Popup title</b>
      <p style="color:${tc};opacity:.7;font-size:12px;margin-top:6px">This is an example modal dialog rendered from your settings.</p>
    </div></div>`;
}

const statusChips=(g,m,round)=>['success','warning','error','info'].map(k=>{
  const c=g(m+'__status_colors__'+k+'_color');
  return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:${c}"><span style="width:10px;height:10px;border-radius:${round?'50%':'3px'};background:${c}"></span>${k}</span>`;
}).join('');

function alertPreviewAndroid(el){
  const s=state['alerts'], m=tabMode['alerts'], g=k=>s[k];
  const r=lenv(g('snackbar__corner_radius'));
  const bg=g(m+'__snackbar_colors__background_color'), t=g(m+'__snackbar_colors__text_color'), a=g(m+'__snackbar_colors__action_color');
  const pane=m==='dark'?'#1e1e20':'#eef0f4';
  el.innerHTML=`<div style="padding:18px;background:${pane};border-radius:9px;display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0">
    <div style="background:${bg};color:${t};border-radius:${r};padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)">Snackbar message
      ${g('snackbar__show_action_button')?`<span style="margin-left:auto;color:${a};font-weight:700;font-size:11px">ACTION</span>`:''}</div>
    <div style="align-self:center;background:${bg};color:${t};border-radius:999px;padding:6px 16px;font-size:11px;opacity:.92">Toast message</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap">${statusChips(g,m,false)}</div></div>`;
}

function alertPreviewIOS(el){
  const s=state['alerts'], m=tabMode['alerts'], g=k=>s[k];
  const r=lenv(g('notification_banner__corner_radius'));
  const bg=g(m+'__banner_colors__background_color'), t=g(m+'__banner_colors__title_color'), msg=g(m+'__banner_colors__message_color');
  const pane=m==='dark'?'#000000':'#eef0f4';
  el.innerHTML=`<div style="padding:18px;background:${pane};border-radius:9px;display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0">
    <div style="background:${bg};border-radius:${r};padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)">
      <span style="width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#4f8ef7,#a855f7);flex-shrink:0"></span>
      <span style="min-width:0"><b style="color:${t};font-size:12px;display:block">Notification title</b><span style="color:${msg};font-size:11px">Banner message preview</span></span>
      <span style="margin-left:auto;color:${msg};font-size:10px;flex-shrink:0">now</span></div>
    ${g('progress_indicators__progress_tint')?`
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:16px;height:16px;border:2.5px solid ${g('progress_indicators__indicator_tint')};border-top-color:transparent;border-radius:50%;display:inline-block"></span>
      <span style="flex:1;height:${lenv(g('progress_indicators__progress_bar_height'))||'4px'};border-radius:99px;background:${g('progress_indicators__progress_track')};overflow:hidden;display:block"><span style="display:block;width:62%;height:100%;background:${g('progress_indicators__progress_tint')}"></span></span>
    </div>
    <div style="align-self:center;background:${bg};color:${t};font-size:${Math.max(10,Math.round((Number(g('toast__toast_font_size'))||15)*0.8))}px;padding:7px 16px;border-radius:${lenv(g('toast__toast_radius'))||'12px'};box-shadow:0 6px 18px rgba(0,0,0,.35)">Saved ✓</div>`:''}
    <div style="display:flex;gap:14px;flex-wrap:wrap">${statusChips(g,m,true)}</div></div>`;
}

function updateAlertPreview(){
  const el=document.getElementById('alertPreviewBody'); if(!el) return;
  if(activePlatform==='android') return alertPreviewAndroid(el);
  if(activePlatform==='ios') return alertPreviewIOS(el);
  const m=tabMode['alerts'], g=k=>gv('alerts',k);
  const br=lenv(g('shape__border_radius')), pad=lenv(g('shape__padding')), bs=g('shape__border_style');
  const icon=g('behavior__show_icon');
  const paneBg=m==='dark'?'#1e1e20':'#eef0f4';
  const kinds=[['success_alert','✓','Success — changes saved.'],['warning_alert','⚠','Warning — check this value.'],['error_alert','✕','Error — something went wrong.'],['info_alert','ℹ','Info — a helpful note.']];
  el.innerHTML=`<div class="alert-preview" style="background:${paneBg}">`+kinds.map(([k,ic,msg])=>{
    const p=x=>g(m+'__'+k+'__'+x);
    const border=bs==='Full border'?`border:1px solid ${p('border_color')};`:bs==='Left accent'?`border-left:4px solid ${p('border_color')};`:'';
    return `<div style="background:${p('background_color')};color:${p('text_color')};${border}border-radius:${br};padding:${pad};font-size:12.5px;margin-bottom:8px;display:flex;gap:8px;align-items:center">
      ${icon?`<span style="color:${p('icon_color')};font-weight:700">${ic}</span>`:''}${msg}</div>`;
  }).join('')+`</div>`;
}

const PREVIEW_REG={
  appbar:['appbarPreviewBody',updateAppBarPreview],
  tokens:['tokensPreviewBody',updateTokensPreview],
  bottomnav:['bottomnavPreviewBody',updateBottomNavPreview],
  fab:['fabPreviewBody',updateFabPreview],
  chips:['chipsPreviewBody',updateChipsPreview],
  branding:['themePreviewBody',updateThemePreview],
  typography:['typoPreviewBody',updateTypoPreview],
  layout:['layoutPreviewBody',updateLayoutPreview],
  navigation:['navPreviewBody',updateNavPreview],
  tabbar:['tabbarPreviewBody',updateTabBarPreview],
  sidemenu:['sidemenuPreviewBody',updateSideMenuPreview],
  collections:['collectionsPreviewBody',updateCollectionsPreview],
  emptystates:['emptyPreviewBody',updateEmptyStatePreview],
  onboarding:['onboardingPreviewBody',updateOnboardingPreview],
  assets:['assetsPreviewBody',updateAssetsPreview],
  buttons:['btnPreviewBody',updateButtonPreview],
  forms:['formPreviewBody',updateFormPreview],
  tables:['tablePreviewBody',updateTablePreview],
  cards:['cardPreviewBody',updateCardPreview],
  popup:['popupPreviewBody',updatePopupPreview],
  alerts:['alertPreviewBody',updateAlertPreview],
  images:['imgPreviewBody',updateImagePreview],
};
function updateActivePreview(){ const p=PREVIEW_REG[activeTab]; if(p) p[1](); }

/* ---------- footer / dirty ---------- */
function onChange(){ renderSidebar(); renderPlatformBar(); syncFooter(); updateActivePreview(); }
function syncFooter(){
  const d=isDirty(activeTab);
  btnSave.disabled=!d;
  statusEl.textContent=d?'● Unsaved changes':'All changes saved';
  statusEl.classList.toggle('dirty',d);
}
btnSave.onclick=()=>{
  saved[activeTab]=clone(state[activeTab]); // → POST /api/setting-fields/values { platform, type_id, values[] }
  renderSidebar(); renderPlatformBar(); syncFooter();
  const t=TABS.find(x=>x.id===activeTab);
  const plat=PLATFORMS.find(p=>p.id===activePlatform);
  toast.innerHTML=`✅ <b>${plat.label} · ${t.label}</b> settings saved`;
  toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2200);
};
btnReset.onclick=()=>{
  if(!isDirty(activeTab)||confirm('Discard unsaved changes and restore last saved values?')){
    state[activeTab]=clone(saved[activeTab]); renderSidebar(); renderPlatformBar(); renderContent(); syncFooter();
  }
};
window.addEventListener('beforeunload',e=>{ if(isDirty(activeTab)){ e.preventDefault(); e.returnValue=''; } });

/* ---------- theme ---------- */
$('#themeToggle').onclick=function(){
  const html=document.documentElement;
  const dark=html.dataset.theme!=='light';
  html.dataset.theme=dark?'light':'dark';
  this.textContent=dark?'☀️ Light':'🌙 Dark';
};

renderPlatformBar(); renderSidebar(); renderContent(); syncFooter();
</script>
</body>
</html>
