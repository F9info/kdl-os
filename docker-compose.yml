# Compose project name. Two projects with the same name on one machine take over
# each other's containers and data volumes, so every project needs its own.
#   - kdl-os itself is `kdl-os` (not `kdl-starter-kit`: older forks such as
#     edmium-crm still carry that name).
#   - A client project made from this kit gets its own name from ./setup.sh, which
#     writes COMPOSE_PROJECT_NAME=<project> into .env. That value beats this line.
# Several projects on one machine: see docs/MULTI_PROJECT_LOCAL.md (own name, own
# port block via the KDL_PORT_* values in .env, lighter local override).
name: kdl-os

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${KDL_PORT_POSTGRES:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    # Password required even on the internal network — any container (or anyone
    # reaching a leaked port) could otherwise read sessions/queues (KDL-270 L14).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}"]
    ports:
      - "127.0.0.1:${KDL_PORT_REDIS:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # MinIO stopped publishing free images (minio/minio, quay.io) in 2026; Chainguard builds MinIO from source.
    # user 0: this image defaults to a non-root user, which cannot write data made by the old (root) image.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${KDL_PORT_MINIO:-9002}:9000"
      - "127.0.0.1:${KDL_PORT_MINIO_CONSOLE:-9003}:9001"
    volumes:
      - miniodata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports:
      - "127.0.0.1:${KDL_PORT_MEILI:-7700}:7700"
    volumes:
      - meilidata:/meili_data

  chromadb:
    image: chromadb/chroma
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${KDL_PORT_CHROMA:-8000}:8000"
    volumes:
      - chromadata:/chroma/chroma

  # E2E mail sink (KDL-97): catches all SMTP traffic from the dockerized stack so
  # tests never send real email. Web UI / HTTP API on :8025, SMTP on :1025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KDL_PORT_SMTP:-1025}:1025"
      - "127.0.0.1:${KDL_PORT_MAIL_UI:-8025}:8025"

  # Virus scanning (KDL-119 A6): optional in dev — start with `--profile scan`.
  # Set CLAMAV_HOST=clamav in .env so the backend actually scans; unset = SKIPPED.
  # The `_base` image ships the signature DB baked in, so clamd accepts
  # connections in ~30s without a freshclam download on first start.
  clamav:
    image: clamav/clamav:1.4_base-debian
    restart: unless-stopped
    profiles: ["scan"]
    ports:
      - "127.0.0.1:${KDL_PORT_CLAMAV:-3310}:3310"
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      # Generated per-project Next.js apps (template-engine site generator).
      - ./frontend/projects:/app/generated-sites
      # Admin frontend source, read-only: the generator copies the page-builder
      # code (import closure) into each generated site so both render alike.
      # Whole directory (not single files): a single-file bind mount goes stale when git
      # or an editor replaces the file, breaking the generator with ENOENT.
      - ./frontend:/app/frontend-src:ro
    environment:
      SITES_DIR: /app/generated-sites
      FRONTEND_SRC_DIR: /app/frontend-src
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Route all direct-SMTP email (password reset fallback etc.) to mailhog —
      # the dockerized stack must never send to real addresses (CI rule, KDL-97).
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # Reach MinIO over the internal network for object operations...
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      # ...but mint presigned URLs against the host-facing endpoint so the browser
      # can load them (host maps minio:9000 -> localhost:${KDL_PORT_MINIO}, default 9002).
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: "${KDL_PORT_MINIO:-9002}"
      # Root .env points MEILISEARCH_HOST at localhost for host-run backends;
      # inside the compose network the service name must be used instead.
      MEILISEARCH_HOST: http://meilisearch:7700
      # Same reasoning as MEILISEARCH_HOST above — .env's localhost:8000 only
      # resolves for host-run backends, not from inside the compose network.
      CHROMADB_URL: http://chromadb:8000
      # Brand inference (KDL-510): .env's localhost:5000 only resolves for
      # host-run backends; inside the compose network use the service name.
      AI_SERVICES_URL: http://ai-services:5000
      # Virus scan (A6): empty default keeps scans SKIPPED; set CLAMAV_HOST=clamav
      # in .env and start the `scan` profile to scan for real.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      # Storage driver (A7): defaults to minio. Set STORAGE_DRIVER=s3|r2 in .env for cloud.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      # Pin the seeded super-admin credentials in the local gate stack (KDL-307).
      # Since KDL-273 H2 the seed generates a random password unless
      # SEED_ADMIN_PASSWORD is set — pinning keeps E2E suites (which default to
      # the same dev-only value in frontend/e2e/helpers/credentials.ts) able to
      # log in after a fresh re-seed. Override via .env; local-dev only.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@kdl.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-kdl-dev-seed-password}
    ports:
      - "127.0.0.1:${KDL_PORT_BACKEND:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      site-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_IMAGE_HOSTS is baked into the Next.js standalone bundle at
        # build time (next.config.ts reads it for CSP img-src + remotePatterns).
        # Changing this value requires a rebuild: `docker compose build frontend`.
        # MinIO host port is 9002 (minio service maps 9002:9000); the backend mints
        # presigned URLs against localhost:9002, so the CSP must allow that host:port.
        NEXT_PUBLIC_IMAGE_HOSTS: http:localhost:${KDL_PORT_MINIO:-9002}
    restart: unless-stopped
    env_file: .env
    environment:
      # Next.js rewrites() proxies /api to the backend over the internal network.
      BACKEND_INTERNAL_URL: http://backend:4000
      # NOTE: NEXT_PUBLIC_IMAGE_HOSTS is a build-time arg (see build.args above).
      # The runtime entry below is inert for standalone Next.js — it is kept only
      # for visibility/debugging so `docker compose config` shows the baked value.
      NEXT_PUBLIC_IMAGE_HOSTS: http:localhost:${KDL_PORT_MINIO:-9002}
    ports:
      - "127.0.0.1:${KDL_PORT_FRONTEND:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Live preview of a generated project site (frontend/projects/<slug>) — the
  # "Frontend view" button in the Web app flow opens this. One project at a
  # time: set SITE_SLUG in .env to switch. Waits until the folder is generated.
  # One-shot (runs as root, then exits): gives the generated-sites folder and the site's node_modules
  # volume to uid 100:101, the backend's user, before the backend and site-preview start. On a Linux
  # server a bind mount keeps the host owner, so without this the backend cannot write the site and
  # site-preview leaves root-owned files the backend cannot replace. (A Mac never showed it.)
  site-perms:
    image: node:22-alpine
    restart: "no"
    user: "0:0"
    volumes:
      - ./frontend/projects:/sites
      - site_preview_modules:/sites/${SITE_SLUG:-default}/node_modules
    command: >
      sh -c "mkdir -p /sites/${SITE_SLUG:-default}/node_modules
      && chown 100:101 /sites
      && chown -R 100:101 /sites/${SITE_SLUG:-default}"

  site-preview:
    image: node:22-alpine
    restart: unless-stopped
    # Same user as the backend (see site-perms), so either can rewrite the other's files.
    user: "100:101"
    depends_on:
      site-perms:
        condition: service_completed_successfully
    working_dir: /sites/${SITE_SLUG:-default}
    volumes:
      - ./frontend/projects:/sites
      - site_preview_modules:/sites/${SITE_SLUG:-default}/node_modules
    environment:
      HOME: /tmp # npm cache and Next.js telemetry need a writable home; uid 100 has none here
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://backend:4000
      FRONTEND_INTERNAL_URL: http://frontend:3000
      NEXT_PUBLIC_IMAGE_HOSTS: http:localhost:${KDL_PORT_MINIO:-9002}
      SITE_ASSET_PREFIX: /site-assets
    command: >
      sh -c "until [ -f package.json ]; do sleep 3; done;
      npm install --no-audit --no-fund && npx next dev -p 3000"

  ai-services:
    build: ./ai-services
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # .env's localhost:8000 only resolves for host-run services, not from
      # inside the compose network — see backend's CHROMADB_URL for the same fix.
      CHROMA_URL: http://chromadb:8000
    ports:
      - "127.0.0.1:${KDL_PORT_AI:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KDL_PORT_HTTP:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      ai-services:
        condition: service_healthy

volumes:
  site_preview_modules:
  pgdata:
  miniodata:
  meilidata:
  chromadata:
  clamdata:
