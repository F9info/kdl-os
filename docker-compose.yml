# Pin ONE Compose project name for every clone (local + Paperclip) so there is a
# single shared stack / DB. A committed `name:` beats the directory-default and
# stops the kdl-starter-kit vs kdl-dev-local drift. (A shell COMPOSE_PROJECT_NAME
# or a -p flag still overrides this — keep both unset.)
name: kdl-starter-kit

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    # Password required even on the internal network — any container (or anyone
    # reaching a leaked port) could otherwise read sessions/queues (KDL-270 L14).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - miniodata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data

  chromadb:
    image: chromadb/chroma
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chromadata:/chroma/chroma

  # E2E mail sink (KDL-97): catches all SMTP traffic from the dockerized stack so
  # tests never send real email. Web UI / HTTP API on :8025, SMTP on :1025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Virus scanning (KDL-119 A6): optional in dev — start with `--profile scan`.
  # Set CLAMAV_HOST=clamav in .env so the backend actually scans; unset = SKIPPED.
  # The `_base` image ships the signature DB baked in, so clamd accepts
  # connections in ~30s without a freshclam download on first start.
  clamav:
    image: clamav/clamav:1.4_base-debian
    restart: unless-stopped
    profiles: ["scan"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Route all direct-SMTP email (password reset fallback etc.) to mailhog —
      # the dockerized stack must never send to real addresses (CI rule, KDL-97).
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # Reach MinIO over the internal network for object operations...
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      # ...but mint presigned URLs against the host-facing endpoint so the browser
      # can load them (host maps minio:9000 -> localhost:9002).
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: "9002"
      # Root .env points MEILISEARCH_HOST at localhost for host-run backends;
      # inside the compose network the service name must be used instead.
      MEILISEARCH_HOST: http://meilisearch:7700
      # Same reasoning as MEILISEARCH_HOST above — .env's localhost:8000 only
      # resolves for host-run backends, not from inside the compose network.
      CHROMADB_URL: http://chromadb:8000
      # Brand inference (KDL-510): .env's localhost:5000 only resolves for
      # host-run backends; inside the compose network use the service name.
      AI_SERVICES_URL: http://ai-services:5000
      # Virus scan (A6): empty default keeps scans SKIPPED; set CLAMAV_HOST=clamav
      # in .env and start the `scan` profile to scan for real.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      # Storage driver (A7): defaults to minio. Set STORAGE_DRIVER=s3|r2 in .env for cloud.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      # Pin the seeded super-admin credentials in the local gate stack (KDL-307).
      # Since KDL-273 H2 the seed generates a random password unless
      # SEED_ADMIN_PASSWORD is set — pinning keeps E2E suites (which default to
      # the same dev-only value in frontend/e2e/helpers/credentials.ts) able to
      # log in after a fresh re-seed. Override via .env; local-dev only.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@kdl.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-kdl-dev-seed-password}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_IMAGE_HOSTS is baked into the Next.js standalone bundle at
        # build time (next.config.ts reads it for CSP img-src + remotePatterns).
        # Changing this value requires a rebuild: `docker compose build frontend`.
        # MinIO host port is 9002 (minio service maps 9002:9000); the backend mints
        # presigned URLs against localhost:9002, so the CSP must allow that host:port.
        NEXT_PUBLIC_IMAGE_HOSTS: http:localhost:9002
    restart: unless-stopped
    env_file: .env
    environment:
      # Next.js rewrites() proxies /api to the backend over the internal network.
      BACKEND_INTERNAL_URL: http://backend:4000
      # NOTE: NEXT_PUBLIC_IMAGE_HOSTS is a build-time arg (see build.args above).
      # The runtime entry below is inert for standalone Next.js — it is kept only
      # for visibility/debugging so `docker compose config` shows the baked value.
      NEXT_PUBLIC_IMAGE_HOSTS: http:localhost:9002
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy

  ai-services:
    build: ./ai-services
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # .env's localhost:8000 only resolves for host-run services, not from
      # inside the compose network — see backend's CHROMADB_URL for the same fix.
      CHROMA_URL: http://chromadb:8000
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      ai-services:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  meilidata:
  chromadata:
  clamdata:
