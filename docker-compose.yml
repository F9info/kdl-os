services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - miniodata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  chromadb:
    image: chromadb/chroma
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma

  # E2E mail sink (KDL-97): catches all SMTP traffic from the dockerized stack so
  # tests never send real email. Web UI / HTTP API on :8025, SMTP on :1025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Virus scanning (KDL-119 A6): optional in dev — start with `--profile scan`.
  # Set CLAMAV_HOST=clamav in .env so the backend actually scans; unset = SKIPPED.
  # The `_base` image ships the signature DB baked in, so clamd accepts
  # connections in ~30s without a freshclam download on first start.
  clamav:
    image: clamav/clamav:1.4_base-debian
    restart: unless-stopped
    profiles: ["scan"]
    ports:
      - "3310:3310"
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Route all direct-SMTP email (password reset fallback etc.) to mailhog —
      # the dockerized stack must never send to real addresses (CI rule, KDL-97).
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # Reach MinIO over the internal network for object operations...
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      # ...but mint presigned URLs against the host-facing endpoint so the browser
      # can load them (host maps minio:9000 -> localhost:9002).
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: "9002"
      # Root .env points MEILISEARCH_HOST at localhost for host-run backends;
      # inside the compose network the service name must be used instead.
      MEILISEARCH_HOST: http://meilisearch:7700
      # Same reasoning as MEILISEARCH_HOST above — .env's localhost:8000 only
      # resolves for host-run backends, not from inside the compose network.
      CHROMADB_URL: http://chromadb:8000
      # Virus scan (A6): empty default keeps scans SKIPPED; set CLAMAV_HOST=clamav
      # in .env and start the `scan` profile to scan for real.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      # Storage driver (A7): defaults to minio. Set STORAGE_DRIVER=s3|r2 in .env for cloud.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # Next.js rewrites() proxies /api to the backend over the internal network.
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy

  ai-services:
    build: ./ai-services
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # .env's localhost:8000 only resolves for host-run services, not from
      # inside the compose network — see backend's CHROMADB_URL for the same fix.
      CHROMA_URL: http://chromadb:8000
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      ai-services:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  meilidata:
  chromadata:
  clamdata:
