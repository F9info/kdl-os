# Infrastructure-only stack. Credentials come from .env (${VAR:?} fails the
# stack fast when one is missing — no silent defaults), and every port is bound
# to 127.0.0.1 so nothing listens on external interfaces (KDL-270 M11).
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    ports:
      - "127.0.0.1:${KDL_PORT_POSTGRES:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}"]
    ports:
      - "127.0.0.1:${KDL_PORT_REDIS:-6380}:6379"

  minio:
    # MinIO stopped publishing free images (minio/minio, quay.io) in 2026; Chainguard builds MinIO from source.
    # user 0: this image defaults to a non-root user, which cannot write data made by the old (root) image.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required in .env}
    ports:
      - "127.0.0.1:${KDL_PORT_MEILI:-7700}:7700"
    volumes:
      - meilidata:/meili_data

  chromadb:
    image: chromadb/chroma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KDL_PORT_CHROMA:-8000}:8000"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  miniodata:
  meilidata:
  chromadata:
