# Development and staging edge: plain HTTP on 127.0.0.1:80. NOT for production, use nginx.prod.conf there
# (TLS, HSTS, http->https). Keep this file self-contained: the staging deploy copies only this file.
# backend/tests/regression/nginx-config.test.js keeps both files in step.
events {
  worker_connections 1024;
}

http {
  # Do not announce the nginx version.
  server_tokens off;

  resolver 127.0.0.11 valid=30s ipv6=off;

  # Only a real websocket upgrade is forwarded as "upgrade"; everything else gets a normal connection.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Per-client request limits in front of the app's own limiter. 429 instead of the default 503.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=10r/s;
  limit_req_status 429;

  server {
    listen 80;
    server_name _;

    # Small by default; the routes that take uploads raise it below.
    client_max_body_size 2M;

    # Backend liveness (root-level /health, not under /api) — used by cd-staging's post-deploy check.
    location = /health {
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_set_header Host $host;
    }

    location /api/notifications/stream {
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # nginx is the first hop, so the client address is $remote_addr. Appending to a client-sent
      # X-Forwarded-For would let anyone choose the address the app's rate limits see.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding on;
    }

    # Sign-in, register, password reset: the routes people attack. Burst allows a normal page of calls.
    location /api/auth/ {
      limit_req zone=auth_zone burst=40 nodelay;
      client_max_body_size 64k;
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
      client_max_body_size 50M; # media uploads and imports
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /ai/ {
      limit_req zone=ai_zone burst=20 nodelay;
      client_max_body_size 30M; # audio for transcription
      set $ai_host ai-services:5000;
      proxy_pass http://$ai_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # --- One origin, two apps ---------------------------------------------
    # Admin app (Next.js standalone): auth screens, /admin panel, and the
    # shared static assets the generated site also pulls from it.
    # It sets its own security headers (next.config.ts), so none are added here.
    # /membership/<x> (member login, signup, account...) is the admin app's; the exact /membership page is the site's.
    location ~ ^/((login|register|forgot-password|reset-password|change-password|admin|share|_next|seed|vendor)(/|$)|membership/) {
      set $frontend_host frontend:3000;
      proxy_pass http://$frontend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Generated site's own /_next assets live under /site-assets (assetPrefix
    # in the site's next.config.mjs) so they don't collide with the admin's.
    location /site-assets/ {
      set $site_host site-preview:3000;
      rewrite ^/site-assets/(.*)$ /$1 break;
      proxy_pass http://$site_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else is the public website (/, /<page-slug>, /p/*, ...). The generated site sets no
    # security headers of its own, so the safe defaults are added here. (A Content-Security-Policy is
    # left to the site itself: a generic one would break its inline scripts and media hosts.)
    location / {
      set $site_host site-preview:3000;
      proxy_pass http://$site_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
  }
}
