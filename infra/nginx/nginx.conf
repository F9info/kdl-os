events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=30s ipv6=off;

  server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location /api/notifications/stream {
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding on;
    }

    location /api/ {
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    location /ai/ {
      set $ai_host ai-services:5000;
      proxy_pass http://$ai_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    # --- One origin, two apps ---------------------------------------------
    # Admin app (Next.js standalone): auth screens, /admin panel, and the
    # shared static assets the generated site also pulls from it.
    location ~ ^/(login|register|forgot-password|reset-password|change-password|admin|share|_next|seed|vendor)(/|$) {
      set $frontend_host frontend:3000;
      proxy_pass http://$frontend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    # Generated site's own /_next assets live under /site-assets (assetPrefix
    # in the site's next.config.mjs) so they don't collide with the admin's.
    location /site-assets/ {
      set $site_host site-preview:3000;
      rewrite ^/site-assets/(.*)$ /$1 break;
      proxy_pass http://$site_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
    }

    # Everything else is the public website (/, /<page-slug>, /p/*, ...).
    location / {
      set $site_host site-preview:3000;
      proxy_pass http://$site_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
