# Production edge: TLS 1.2+, HSTS, http -> https. The location blocks match nginx.conf (a test keeps them in
# step); only the listeners, TLS and HSTS differ.
#
# Certificates: put fullchain.pem and privkey.pem in infra/certs/ (mounted read-only at /etc/nginx/certs,
# never committed), for example from Let's Encrypt. If a load balancer terminates TLS in front of this stack,
# use nginx.conf behind it instead (set NGINX_CONF) and keep the app reachable only from the load balancer.
events {
  worker_connections 1024;
}

http {
  server_tokens off;

  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=10r/s;
  limit_req_status 429;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Plain HTTP only redirects (and answers the health check). Nothing is served over it.
  server {
    listen 80;
    server_name _;

    location = /health {
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_set_header Host $host;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 2M;

    # One HSTS header, ours (a location that adds its own headers must repeat it, nginx does not inherit): helmet in the API sets its own, so the upstream copy is dropped.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Backend liveness (root-level /health, not under /api) — used by cd-staging's post-deploy check.
    location = /health {
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_set_header Host $host;
    }

    location /api/notifications/stream {
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # nginx is the first hop, so the client address is $remote_addr. Appending to a client-sent
      # X-Forwarded-For would let anyone choose the address the app's rate limits see.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding on;
    }

    # Sign-in, register, password reset: the routes people attack. Burst allows a normal page of calls.
    location /api/auth/ {
      limit_req zone=auth_zone burst=40 nodelay;
      client_max_body_size 64k;
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
      client_max_body_size 50M; # media uploads and imports
      set $backend_host backend:4000;
      proxy_pass http://$backend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /ai/ {
      limit_req zone=ai_zone burst=20 nodelay;
      client_max_body_size 30M; # audio for transcription
      set $ai_host ai-services:5000;
      proxy_pass http://$ai_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # --- One origin, two apps ---------------------------------------------
    # Admin app (Next.js standalone): auth screens, /admin panel, and the
    # shared static assets the generated site also pulls from it.
    # It sets its own security headers (next.config.ts), so none are added here.
    location ~ ^/(login|register|forgot-password|reset-password|change-password|admin|share|_next|seed|vendor)(/|$) {
      set $frontend_host frontend:3000;
      proxy_pass http://$frontend_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Generated site's own /_next assets live under /site-assets (assetPrefix
    # in the site's next.config.mjs) so they don't collide with the admin's.
    location /site-assets/ {
      set $site_host site-preview:3000;
      rewrite ^/site-assets/(.*)$ /$1 break;
      proxy_pass http://$site_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Everything else is the public website (/, /<page-slug>, /p/*, ...). The generated site sets no
    # security headers of its own, so the safe defaults are added here. (A Content-Security-Policy is
    # left to the site itself: a generic one would break its inline scripts and media hosts.)
    location / {
      set $site_host site-preview:3000;
      proxy_pass http://$site_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
  }
}
